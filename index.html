<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quito Tracker - Mapa Retro Pixel Art</title>
  
  <!-- Fuente Pixel Art -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* -----------------------------------------------------------
       1. CONFIGURACIÓN BASE & ESTILOS RETRO PIXEL ART
    ----------------------------------------------------------- */
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #001a4d;
      font-family: 'Press Start 2P', monospace;
      color: #ffffff;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* -----------------------------------------------------------
       PANTALLA DE CARGA / ESTÁTICA HACKER (5 SEGUNDOS)
    ----------------------------------------------------------- */
    #hackerIntro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0a0014;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      color: #E7CD54;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      overflow: hidden;
    }

    #hackerIntro.fade-out {
      opacity: 0;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }

    /* Efecto Estática CRT */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                  linear-gradient(90deg, rgba(229, 5, 46, 0.08), rgba(0, 51, 153, 0.08), rgba(231, 205, 84, 0.05));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 10000;
    }

    #hackerTerminal {
      line-height: 1.8;
      text-shadow: 0 0 5px #E7CD54;
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 12px;
      background-color: #E7CD54;
      animation: blink 0.6s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .glitch-header {
      color: #E5052E;
      margin-bottom: 20px;
      font-size: 14px;
      text-shadow: 2px 2px #E7CD54, -2px -2px #003399;
    }

    /* Cabecera / Banner Superior - Colores Bandera Quito */
    #topHeader {
      background-color: #E5052E;
      border-bottom: 4px solid #E7CD54;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      box-shadow: 0 4px 0 #002266;
    }

    .header-title {
      font-size: 12px;
      color: #FFFFFF;
      text-shadow: 2px 2px #000000;
    }

    /* Contenedor Principal del Mapa */
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* -----------------------------------------------------------
       2. CONTROLES FLOTANTES Y FILTROS LATERALES
    ----------------------------------------------------------- */
    #filterControls {
      position: absolute;
      top: 60px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
    }

    .btn-filter {
      background-color: #003399;
      border: 3px solid #000000;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 3px 3px 0px #000000;
      transition: transform 0.1s;
    }

    .btn-filter:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000000;
    }

    .btn-filter.gratis { border-color: #E7CD54; }
    .btn-filter.pago { border-color: #E5052E; }

    /* -----------------------------------------------------------
       3. AVATAR GALLO VIDEO (ESQUINA INFERIOR IZQUIERDA)
    ----------------------------------------------------------- */
    #galloContainer {
      position: absolute;
      bottom: 70px;
      left: 15px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      z-index: 5;
      pointer-events: none;
    }

    #galloVideo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #E7CD54;
      background-color: #003399;
      box-shadow: 3px 3px 0px #000000;
      object-fit: cover;
    }

    #galloSpeech {
      background-color: #002266;
      border: 3px solid #E5052E;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 9px;
      color: #ffffff;
      max-width: 260px;
      box-shadow: 3px 3px 0px #000000;
      line-height: 1.4;
    }

    /* -----------------------------------------------------------
       4. RADAR CANVAS (ESQUINA INFERIOR DERECHA)
    ----------------------------------------------------------- */
    #radarContainer {
      position: absolute;
      bottom: 70px;
      right: 15px;
      width: 90px;
      height: 90px;
      background-color: rgba(0, 51, 153, 0.9);
      border: 3px solid #E7CD54;
      border-radius: 50%;
      box-shadow: 3px 3px 0px #000000;
      z-index: 5;
      overflow: hidden;
    }

    #radarCanvas {
      width: 100%;
      height: 100%;
    }

    /* -----------------------------------------------------------
       5. PANEL DE BOTONES INFERIOR DESLIZABLE (RUTAS)
    ----------------------------------------------------------- */
    #extraBlueSpace {
      background-color: #003399;
      border-top: 4px solid #E5052E;
      padding: 10px 15px;
      display: flex;
      flex-wrap: nowrap;
      gap: 12px;
      align-items: center;
      z-index: 10;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      max-width: 100vw;
    }

    #extraBlueSpace::-webkit-scrollbar {
      height: 6px;
    }
    #extraBlueSpace::-webkit-scrollbar-track {
      background: #001a4d;
    }
    #extraBlueSpace::-webkit-scrollbar-thumb {
      background: #E7CD54;
      border-radius: 3px;
    }

    #extraBlueSpace.hidden {
      display: none;
    }

    .btn-retro {
      background-color: #001a4d;
      color: #E7CD54;
      border: 2px solid #E7CD54;
      padding: 10px 14px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
      transition: all 0.1s ease-in-out;
      flex-shrink: 0;
    }

    .btn-retro:hover {
      background-color: #E7CD54;
      color: #001a4d;
    }

    .btn-retro.danger {
      color: #ffffff;
      background-color: #E5052E;
      border-color: #ffffff;
    }

    .btn-retro.danger:hover {
      background-color: #b30021;
      color: #ffffff;
    }

    /* -----------------------------------------------------------
       6. PERSONALIZACIÓN DEL INFOWINDOW (TEMÁTICA QUITO)
    ----------------------------------------------------------- */
    .gm-style .gm-style-iw-c {
      padding: 16px !important;
      max-width: 420px !important;
      min-width: 300px !important;
      background-color: #002266 !important;
      border: 3px solid #E7CD54 !important;
      border-radius: 8px !important;
      box-shadow: 5px 5px 0px #000000 !important;
    }

    .gm-style .gm-style-iw-d {
      overflow: auto !important;
      max-height: 350px !important;
    }

    .gm-style button.gm-ui-hover-effect {
      filter: invert(1);
      top: 8px !important;
      right: 8px !important;
    }

    .gm-style .gm-style-iw-tc::after {
      background-color: #E7CD54 !important;
    }
  </style>
</head>
<body>

  <!-- Introducción Hacker / Estática (5 Segundos) -->
  <div id="hackerIntro">
    <div class="crt-overlay"></div>
    <div>
      <div class="glitch-header">> INITIALIZING CYBER_QUITO_NET v8.0</div>
      <div id="hackerTerminal"></div><span class="cursor"></span>
    </div>
    <div style="color: #E7CD54; font-size: 9px;">[SYS_STATUS: INJECTING_QUITO_COLORS...]</div>
  </div>

  <div id="app-container">
    <!-- Banner Superior -->
    <div id="topHeader">
      <div class="header-title">QUITO TRACKER 8-BIT</div>
      <div style="font-size: 10px; color: #E7CD54;">[Quito](http://googleusercontent.com/map_location_reference/2), Ecuador</div>
    </div>

    <!-- El Mapa de Google -->
    <div id="map"></div>

    <!-- Filtros de Categoría -->
    <div id="filterControls">
      <button class="btn-filter gratis" onclick="filtrarLugares('GRATIS')">
        <span>🕷️</span> <span style="font-size: 9px; color: #E7CD54;">GRATIS</span>
      </button>
      <button class="btn-filter pago" onclick="filtrarLugares('PAID')">
        <span>🕷️</span> <span style="font-size: 9px; color: #ffffff;">PAGO</span>
      </button>
    </div>

    <!-- Personaje Gallo parlante en Video (Muted / Sin Audio) -->
    <div id="galloContainer">
      <video id="galloVideo" src="./gallo.mp4" playsinline muted preload="metadata"></video>
      <div id="galloSpeech">¡EXPLORA Y DESCUBRE LOS RINCONES MÁGICOS DE QUITO!</div>
    </div>

    <!-- Radar Canvas estilo SpiderWeb -->
    <div id="radarContainer">
      <canvas id="radarCanvas" width="90" height="90"></canvas>
    </div>

    <!-- Panel Deslizable de Botones (Rutas / Cómo Llegar) -->
    <div id="extraBlueSpace" class="hidden">
      <button class="btn-retro" onclick="trazarRuta('driving')">🚗 CARRO</button>
      <button class="btn-retro" onclick="trazarRuta('walking')">🚶 PIE</button>
      <button class="btn-retro" onclick="trazarRuta('two-wheeler')">🛵 MOTO</button>
      <button class="btn-retro" onclick="trazarRuta('transit')">🚌 BUS</button>
      <button class="btn-retro danger" onclick="limpiarRuta()">❌ LIMPIAR</button>
    </div>
  </div>

  <!-- Script Principal de la Aplicación -->
  <script>
    let map;
    let infoWindow;
    let lugaresPuntos = [];
    let destinoSeleccionado = null;
    let markersMap = [];
    let radarAngle = 0;

    /* -----------------------------------------------------------
       SECUENCIA HACKER (5 SEGUNDOS)
    ----------------------------------------------------------- */
    const hackerCommands = [
      "> CONNECTING TO QUITO_CORE_SERVER...",
      "> BYPASSING SECURITY GATEWAY_0.2201...",
      "> ACCESSING SATELLITE FEED... [OK]",
      "> APPLYING QUITO_FLAG_THEME (RED & BLUE)...",
      "> LOAD_MODULE: RETRO_PIXEL_MAP_RENDERER",
      "> INITIALIZING GALLO_SPEECH_CORE...",
      "> SYSTEM READY. ACCESS GRANTED."
    ];

    function runHackerIntro() {
      const terminal = document.getElementById("hackerTerminal");
      let lineIndex = 0;

      const interval = setInterval(() => {
        if (lineIndex < hackerCommands.length) {
          terminal.innerHTML += hackerCommands[lineIndex] + "<br>";
          lineIndex++;
        }
      }, 600);

      setTimeout(() => {
        clearInterval(interval);
        const intro = document.getElementById("hackerIntro");
        intro.classList.add("fade-out");
        setTimeout(() => {
          intro.style.display = "none";
        }, 500);
      }, 5000);
    }

    function initMap() {
      const quitoCentro = { lat: -0.1807, lng: -78.4678 };

      /* Configuración del mapa pixelado retro con paleta de la Bandera de Quito */
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: quitoCentro,
        disableDefaultUI: true,
        zoomControl: false,
        fullscreenControl: false,
        streetViewControl: false,
        mapTypeControl: false,
        styles: [
          /* Fondo de suelo / tierra: Azul Oscuro de Quito */
          { elementType: "geometry", stylers: [{ color: "#001a4d" }] },
          { elementType: "labels.text.stroke", stylers: [{ color: "#000000" }, { weight: 4 }] },
          { elementType: "labels.text.fill", stylers: [{ color: "#E7CD54" }] },
          /* Agua / Ríos: Azul Bandera */
          { featureType: "water", elementType: "geometry", stylers: [{ color: "#003399" }] },
          { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#FFFFFF" }] },
          /* Parques y Paisaje: Azul Medio / Dorado acentuado */
          { featureType: "landscape", elementType: "geometry", stylers: [{ color: "#002699" }] },
          { featureType: "poi", elementType: "geometry", stylers: [{ color: "#001f66" }] },
          { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#003380" }] },
          /* Vías y Calles principales: Rojo Quito */
          { featureType: "road", elementType: "geometry", stylers: [{ color: "#E5052E" }] },
          { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#ff1a40" }] },
          { featureType: "road.highway", elementType: "geometry.stroke", stylers: [{ color: "#E7CD54" }, { weight: 2 }] },
          { featureType: "road.arterial", elementType: "geometry", stylers: [{ color: "#cc0025" }] },
          { featureType: "road.local", elementType: "geometry", stylers: [{ color: "#99001c" }] },
          { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#FFFFFF" }] },
          /* Edificios y Áreas Urbanas */
          { featureType: "transit", elementType: "geometry", stylers: [{ color: "#E7CD54" }] },
          { featureType: "administrative", elementType: "geometry.stroke", stylers: [{ color: "#E5052E" }] }
        ]
      });

      infoWindow = new google.maps.InfoWindow();
      cargarLugares();
      iniciarRadar();
    }

    async function cargarLugares() {
      try {
        const response = await fetch("./lugares.json");
        if (!response.ok) throw new Error("No se pudo cargar lugares.json");
        lugaresPuntos = await response.json();
        renderizarMarcadores(lugaresPuntos);
      } catch (error) {
        console.error("Error al cargar los datos:", error);
        showGalloSpeech("ERROR CARGANDO DATOS DEL SERVIDOR");
      }
    }

    function renderizarMarcadores(lugares) {
      limpiarMarcadores();

      lugares.forEach((lugar) => {
        const marker = new google.maps.Marker({
          position: { lat: lugar.lat, lng: lugar.lng },
          map: map,
          title: lugar.nombre,
          label: {
            text: lugar.sticker || "📍",
            fontSize: "18px"
          }
        });

        markersMap.push(marker);

        marker.addListener("click", (e) => {
          if (e && e.stop) e.stop();
          destinoSeleccionado = lugar;
          
          const panelRutas = document.getElementById("extraBlueSpace");
          if (panelRutas) {
            panelRutas.classList.remove("hidden");
            panelRutas.scrollLeft = 0;
          }

          let listaActividadesHtml = '';
          if (lugar.actividades && Array.isArray(lugar.actividades) && lugar.actividades.length > 0) {
            listaActividadesHtml = `
              <div style="margin-top: 12px;">
                <strong style="color: #E7CD54; font-size: 11px; font-family: 'Press Start 2P', monospace;">ACTIVIDADES:</strong>
                <ul style="margin: 8px 0 0 16px; padding: 0; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; color: #ffffff; line-height: 1.4;">
                  ${lugar.actividades.map(act => `<li style="margin-bottom: 5px;">${act}</li>`).join('')}
                </ul>
              </div>
            `;
          }

          const contentString = `
            <div style="padding: 2px; color: #ffffff;">
              <h3 style="font-family: 'Press Start 2P', monospace; font-size: 13px; color: #E7CD54; margin: 0 0 10px 0; line-height: 1.4;">
                ${lugar.sticker || ''} ${lugar.nombre}
              </h3>
              
              <div style="font-size: 12px; color: #ffffff; margin-bottom: 10px; font-family: system-ui, -apple-system, sans-serif; font-weight: bold;">
                💵 ${lugar.info || lugar.categoria || ''}
              </div>

              ${lugar.descripcion ? `
                <p style="font-size: 13px; font-family: system-ui, -apple-system, sans-serif; color: #e2e8f0; margin: 10px 0; line-height: 1.5;">
                  ${lugar.descripcion}
                </p>
              ` : ''}

              ${listaActividadesHtml}

              ${lugar.recomendacion ? `
                <div style="margin-top: 12px; padding-top: 10px; border-top: 1px dashed #E5052E; font-size: 12px; font-family: system-ui, -apple-system, sans-serif; color: #E7CD54; line-height: 1.4;">
                  💡 <strong>Tip:</strong> ${lugar.recomendacion}
                </div>
              ` : ''}
            </div>`;

          infoWindow.setContent(contentString);
          infoWindow.open(map, marker);
          showGalloSpeech(`DESTINO: ${lugar.nombre.toUpperCase()}`);
        });
      });
    }

    function limpiarMarcadores() {
      markersMap.forEach(m => m.setMap(null));
      markersMap = [];
    }

    window.filtrarLugares = function(tipo) {
      if (tipo === 'GRATIS') {
        const gratis = lugaresPuntos.filter(l => l.categoria && l.categoria.toUpperCase().includes('GRATIS'));
        renderizarMarcadores(gratis);
        showGalloSpeech("MOSTRANDO LUGARES GRATUITOS");
      } else if (tipo === 'PAID') {
        const pago = lugaresPuntos.filter(l => l.categoria && !l.categoria.toUpperCase().includes('GRATIS'));
        renderizarMarcadores(pago);
        showGalloSpeech("MOSTRANDO LUGARES DE PAGO");
      }
    };

    function iniciarRadar() {
      const canvas = document.getElementById("radarCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      function drawRadar() {
        ctx.clearRect(0, 0, 90, 90);

        ctx.strokeStyle = "rgba(231, 205, 84, 0.4)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(45, 45, 20, 0, Math.PI * 2);
        ctx.arc(45, 45, 38, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "#E7CD54";
        ctx.beginPath();
        ctx.moveTo(45, 45);
        ctx.lineTo(45 + 40 * Math.cos(radarAngle), 45 + 40 * Math.sin(radarAngle));
        ctx.stroke();

        if (lugaresPuntos.length > 0) {
          ctx.fillStyle = "#E7CD54";
          ctx.fillRect(35, 30, 4, 4);
          ctx.fillRect(55, 60, 4, 4);
          ctx.fillStyle = "#E5052E";
          ctx.fillRect(40, 55, 4, 4);
        }

        radarAngle += 0.05;
        requestAnimationFrame(drawRadar);
      }
      drawRadar();
    }

    /* -----------------------------------------------------------
       7. APERTURA DIRECTA EN LA APP DE GOOGLE MAPS
    ----------------------------------------------------------- */
    window.trazarRuta = function(modo) {
      if (!destinoSeleccionado) {
        showGalloSpeech("SELECCIONA UN LUGAR EN EL MAPA");
        return;
      }

      showGalloSpeech("ABRIENDO GOOGLE MAPS...");

      const lat = destinoSeleccionado.lat;
      const lng = destinoSeleccionado.lng;
      const nombreLugar = encodeURIComponent(destinoSeleccionado.nombre || "Destino");
      
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&destination_place_id=${nombreLugar}&travelmode=${modo}`;

      window.open(mapsUrl, "_blank");
    };

    window.limpiarRuta = function() {
      document.getElementById("extraBlueSpace").classList.add("hidden");
      infoWindow.close();
      destinoSeleccionado = null;
      showGalloSpeech("SELECCIÓN LIMPIADA");
    };

    /* -----------------------------------------------------------
       8. CONTROL DE REPRODUCCIÓN DEL VIDEO (SIN AUDIO)
    ----------------------------------------------------------- */
    function showGalloSpeech(texto) {
      const speechBox = document.getElementById("galloSpeech");
      if (speechBox) speechBox.textContent = texto;

      const video = document.getElementById("galloVideo");
      if (video) {
        video.muted = true;
        video.currentTime = 0;
        video.play().catch(e => console.log("La reproducción del video requiere interacción previa."));
      }
    }

    function loadGoogleMapsScript() {
      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyD7yh3TteD4adDL8pAVXIEGr6RXksDKGLo&callback=initMap`;
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    }

    window.onload = function() {
      runHackerIntro();
      loadGoogleMapsScript();
    };
  </script>
</body>
</html>
