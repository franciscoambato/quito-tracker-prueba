<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quito Tracker - Mapa Retro Pixel Art</title>
  
  <link rel="icon" type="image/jpeg" href="./logotipo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0d0718; /* Violeta muy oscuro tipo Synthwave */
      font-family: 'Press Start 2P', monospace;
      color: #ffffff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      position: relative;
    }

    /* PANTALLA DE CARGA HACKER */
    #hackerIntro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #0d0718;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      color: #00f0ff; /* Turquesa neón retro */
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      overflow: hidden;
    }

    #hackerIntro.fade-out {
      opacity: 0;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }

    /* CAMBIO 2: Logo ampliado */
    .logo-container {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10001;
      text-align: center;
      pointer-events: none;
      width: 95%;
      max-width: 480px; /* Aumentado de 320px */
    }

    .logo-container img {
      width: 100%;
      height: auto;
      max-width: 420px; /* Aumentado de 280px */
      opacity: 0.95;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 22px #00f0ff);
      animation: glitchLogo 0.3s infinite alternate;
    }

    @keyframes glitchLogo {
      0% { transform: translate(0, 0) scale(1); filter: drop-shadow(0 0 14px #00f0ff); }
      50% { transform: translate(-3px, 3px) scale(1.02); filter: drop-shadow(0 0 24px #ff007f); }
      100% { transform: translate(3px, -2px) scale(0.99); filter: drop-shadow(0 0 16px #00f0ff); }
    }

    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 127, 0.1), rgba(0, 240, 255, 0.1), rgba(255, 234, 0, 0.05));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 10000;
    }

    #hackerTerminal {
      line-height: 1.6;
      text-shadow: 0 0 5px #00a8b3;
      white-space: pre-wrap;
      width: 100%;
      z-index: 10002;
      font-size: 9px;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 12px;
      background-color: #ff007f;
      animation: blink 0.6s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .glitch-header {
      color: #ff007f;
      margin-bottom: 15px;
      font-size: 11px;
      text-shadow: 2px 2px #00a8b3, -2px -2px #2d0a4e;
    }

    /* SELECCIÓN DE PERSONAJE */
    #characterSelectionModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: rgba(13, 7, 24, 0.95);
      z-index: 9998;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    #characterSelectionModal.hidden {
      display: none;
    }

    .modal-box {
      background-color: #1a0b2e;
      border: 3px solid #00f0ff;
      padding: 20px 15px;
      text-align: center;
      width: 100%;
      max-width: 420px;
      box-shadow: 4px 4px 0px #000000;
    }

    .modal-title {
      font-size: 10px;
      color: #00f0ff;
      margin-bottom: 20px;
      line-height: 1.5;
      text-shadow: 2px 2px #000000;
    }

    .characters-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .character-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .character-card:hover, .character-card:active {
      transform: scale(1.05);
    }

    .character-preview-video {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 3px solid #ff007f;
      background-color: #0d0718;
      object-fit: cover;
      object-position: center top;
      box-shadow: 3px 3px 0px #000000;
    }

    .character-btn {
      margin-top: 12px;
      background-color: #0d0718;
      color: #00f0ff;
      border: 2px solid #00f0ff;
      padding: 10px 12px;
      min-height: 44px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
    }

    .character-card:hover .character-btn, .character-card:active .character-btn {
      background-color: #00f0ff;
      color: #0d0718;
    }

    /* CAMBIO 1: HEADER CENTRADO Y MÁS GRANDE */
    #topHeader {
      background-color: #1a0b2e;
      border-bottom: 3px solid #ff007f;
      padding: 12px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      box-shadow: 0 4px 0 #000000;
    }

    .header-title {
      font-size: 14px; /* Aumentado */
      color: #00f0ff;
      text-shadow: 2px 2px #000000;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 9px;
      color: #ff007f;
    }

    #map {
      flex: 1;
      width: 100%;
      height: calc(100% - 0.3cm);
      margin-bottom: 0.3cm;
    }

    /* BOTONES OVALADOS Y DE CATEGORÍA */
    #filterControls {
      position: absolute;
      top: 65px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      padding-right: 5px;
    }

    .btn-filter {
      background-color: #1a0b2e;
      border: 2px solid #000000;
      padding: 8px 14px;
      min-height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 2px 2px 0px #000000;
      transition: transform 0.1s, background-color 0.2s;
      border-radius: 20px;
    }

    .btn-filter span {
      font-size: 8px;
      font-weight: bold;
    }

    .btn-filter:hover, .btn-filter:active {
      transform: scale(1.03);
    }

    /* Estilos Neón Retro para Filtros */
    .btn-filter.gratis { border-color: #00f0ff; color: #00f0ff; }
    .btn-filter.pago { border-color: #ff007f; color: #ff007f; }
    .btn-filter.jovenes { border-color: #ffea00; color: #ffea00; }
    .btn-filter.museos { border-color: #b537f2; color: #b537f2; }
    .btn-filter.parques { border-color: #00ff66; color: #00ff66; }
    .btn-filter.leyendas { border-color: #ff7700; color: #ff7700; }
    .btn-filter.todos { border-color: #ffffff; color: #ffffff; }

    /* AVATAR DE ACOMPAÑANTE */
    #galloContainer {
      position: absolute;
      bottom: 65px;
      left: 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      z-index: 5;
      pointer-events: none;
      max-width: 65vw;
    }

    #galloVideo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #00f0ff;
      background-color: #1a0b2e;
      box-shadow: 2px 2px 0px #000000;
      object-fit: cover;
      object-position: center top;
      flex-shrink: 0;
    }

    #galloSpeech {
      background-color: #1a0b2e;
      border: 2px solid #ff007f;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 8px;
      color: #ffffff;
      box-shadow: 2px 2px 0px #000000;
      line-height: 1.3;
      word-break: break-word;
    }

    /* CONTROLES Y RADAR */
    #radarControls {
      position: absolute;
      bottom: 65px;
      right: 85px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }

    .btn-radar-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #1a0b2e;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-radar-icon:hover, .btn-radar-icon:active {
      background-color: #00f0ff;
      color: #0d0718;
      transform: scale(1.05);
    }

    #radarContainer {
      position: absolute;
      bottom: 65px;
      right: 10px;
      width: 70px;
      height: 70px;
      background-color: rgba(26, 11, 46, 0.9);
      border: 2px solid #00f0ff;
      border-radius: 50%;
      box-shadow: 2px 2px 0px #000000;
      z-index: 5;
      overflow: hidden;
    }

    #radarCanvas {
      width: 100%;
      height: 100%;
    }

    /* RUTAS */
    #extraBlueSpace {
      background-color: #1a0b2e;
      border-top: 3px solid #00f0ff;
      padding: 8px 10px;
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      align-items: center;
      z-index: 10;
      overflow-x: auto;
      white-space: nowrap;
      max-width: 100vw;
      -webkit-overflow-scrolling: touch;
    }

    #extraBlueSpace.hidden {
      display: none;
    }

    .btn-retro {
      background-color: #0d0718;
      color: #00f0ff;
      border: 2px solid #00f0ff;
      padding: 8px 12px;
      min-height: 44px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .btn-retro:hover, .btn-retro:active {
      background-color: #00f0ff;
      color: #0d0718;
    }

    .btn-retro.danger {
      color: #ffffff;
      background-color: #ff007f;
      border-color: #ffffff;
    }

    /* INFOWINDOW DE MAPS */
    .gm-style .gm-style-iw-c {
      padding: 12px !important;
      max-width: 85vw !important;
      min-width: 240px !important;
      background-color: #1a0b2e !important;
      border: 2px solid #00f0ff !important;
      border-radius: 6px !important;
      box-shadow: 3px 3px 0px #000000 !important;
    }

    @media (min-width: 768px) {
      .header-title { font-size: 18px; }
      .header-subtitle { font-size: 11px; }
      #galloVideo { width: 75px; height: 75px; }
      #galloSpeech { font-size: 9px; max-width: 260px; }
      #radarContainer { width: 90px; height: 90px; }
      #radarControls { right: 110px; }
      .modal-title { font-size: 11px; }
      .character-preview-video { width: 110px; height: 110px; }
      .logo-container { max-width: 520px; }
      .logo-container img { max-width: 480px; }
    }
  </style>
</head>

    /* CAMBIO 3: ESCRITURA HUMANA CON TIEMPOS ALEATORIOS Y PAUSAS */
    window.addEventListener('load', () => {
      const terminal = document.getElementById('hackerTerminal');
      const texto = "Cargando nodos retro...\nInicializando mapa de Quito 8-Bit...\nConectando datos geográficos...\n¡Sistema listo!";
      let idx = 0;

      function escribirSimulacionHumana() {
        if (idx < texto.length) {
          const char = texto.charAt(idx);
          terminal.textContent += char;
          idx++;

          // Genera un retardo humano natural entre 20ms y 90ms
          let delay = Math.floor(Math.random() * 70) + 20;

          // Pausas naturales en saltos de línea o puntos
          if (char === '\n') {
            delay = Math.floor(Math.random() * 200) + 250;
          } else if (char === '.' || char === '!') {
            delay = Math.floor(Math.random() * 150) + 120;
          }

          setTimeout(escribirSimulacionHumana, delay);
        } else {
          setTimeout(() => {
            const hackerIntro = document.getElementById('hackerIntro');
            hackerIntro.classList.add('fade-out');
            document.getElementById('characterSelectionModal').classList.remove('hidden');
          }, 800);
        }
      }

      escribirSimulacionHumana();
    });
