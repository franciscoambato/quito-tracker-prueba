<!-- Reemplaza la etiqueta <script> y todo su contenido por este bloque completo -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7yh3TteD4adDL8pAVXIEGr6RXksDKGLo&callback=initMap" async defer></script>

<script>
  let map;
  let infoWindow;
  let markers = [];

  let lugaresPuntos = [
    {
      "etiqueta": "PLANES DESTACADOS PARA JÓVENES",
      "nombre": "Di Pinto (Café & Taller de Arte)",
      "lat": -0.1785,
      "lng": -78.4812,
      "categoria": "HASTA $15 USD",
      "zona": "NORTE",
      "tipo": "Plan Jóvenes 1 / Arte & Café",
      "sticker": "🎨",
      "info": "Kits de pintura y cerámica desde $12.00 USD.",
      "descripcion": "Concepto de café-taller súper viral en redes enfocado en liberar el estrés. Puedes tomar café o bebidas frías mientras personalizas cerámica, macetas, lienzos, gorras o bolsas de tela.",
      "actividades": ["Pintar macetas y piezas de cerámica", "Personalizar tote bags o lienzos", "Disfrutar de café y postres gourmet"],
      "recomendacion": "Ideal para ir en pareja o con amigos. Reserva con tiempo o ve temprano los fines de semana."
    },
    {
      "etiqueta": "PLANES DESTACADOS PARA JÓVENES",
      "nombre": "Cafetería Roca Roja",
      "lat": -0.1812,
      "lng": -78.4795,
      "categoria": "HASTA $20 USD",
      "zona": "NORTE",
      "tipo": "Plan Jóvenes 2 / Cerámica & Café",
      "sticker": "🪴",
      "info": "Kits de arcilla y pintura desde $15.00 hasta $25.00 USD.",
      "descripcion": "Un espacio con estética acogedora diseñado para amantes del arte en arcilla y la cerámica. Ofrecen kits completos con pinceles y pinturas acrílicas para moldear y pintar macetas, tazas o espejos.",
      "actividades": ["Moldear arcilla desde cero", "Pintar macetas, tazas y espejos de mesa", "Armar pulseras con charms mientras tomas café"],
      "recomendacion": "Su kit de regalo con pieza de cerámica es uno de los planes más populares entre jóvenes en TikTok e Instagram."
    },
    {
      "etiqueta": "MUSEOS",
      "nombre": "Museo de la Ciudad",
      "lat": -0.2251,
      "lng": -78.5152,
      "categoria": "HASTA $10 USD",
      "zona": "CENTRO",
      "tipo": "Museo 1 / Historia",
      "sticker": "📜",
      "info": "Adultos: $4.00, Estudiantes: $2.00, Niños y Tercera edad: $2.00.",
      "descripcion": "Ubicado en el antiguo Hospital San Juan de Dios, ofrece un recorrido interactivo sobre la historia de Quito desde la era precolombina.",
      "actividades": ["Recorrer maquetas de la vida cotidiana en distintas épocas", "Visitar los patios coloniales"],
      "recomendacion": "Un espacio indispensable para entender la evolución sociocultural de Quito."
    },
    {
      "etiqueta": "PARQUES",
      "nombre": "Parque La Carolina",
      "lat": -0.1825,
      "lng": -78.4845,
      "categoria": "GRATIS",
      "zona": "NORTE",
      "tipo": "Parque 1 / Recreativo",
      "sticker": "🌳",
      "info": "Acceso libre para todo público.",
      "descripcion": "El parque urbano más activo en el corazón financiero de Quito, ideal para deporte y paseo familiar.",
      "actividades": ["Pasear en barca por la laguna", "Hacer skate o atletismo", "Visitar el Jardín Botánico (de pago)"],
      "recomendacion": "Cerca de centros comerciales y la línea del Metro de Quito."
    }
  ];

  function initMap() {
    const quitoCentro = { lat: -0.180653, lng: -78.467838 };

    map = new google.maps.Map(document.getElementById("map"), {
      zoom: 12,
      center: quitoCentro,
      disableDefaultUI: true,
      styles: [
        { elementType: "geometry", stylers: [{ color: "#0d0718" }] },
        { elementType: "labels.text.stroke", stylers: [{ color: "#0d0718" }] },
        { elementType: "labels.text.fill", stylers: [{ color: "#00f0ff" }] },
        {
          featureType: "administrative.locality",
          elementType: "labels.text.fill",
          stylers: [{ color: "#ff007f" }]
        },
        {
          featureType: "poi",
          elementType: "labels.text.fill",
          stylers: [{ color: "#00f0ff" }]
        },
        {
          featureType: "road",
          elementType: "geometry",
          stylers: [{ color: "#1a0b2e" }]
        },
        {
          featureType: "road",
          elementType: "geometry.stroke",
          stylers: [{ color: "#2d0a4e" }]
        },
        {
          featureType: "water",
          elementType: "geometry",
          stylers: [{ color: "#05030a" }]
        }
      ]
    });

    infoWindow = new google.maps.InfoWindow();
    cargarMarcadores(lugaresPuntos);
    dibujarRadar();
  }

  function cargarMarcadores(lugares) {
    limpiarMarcadores();

    lugares.forEach(lugar => {
      const marker = new google.maps.Marker({
        position: { lat: lugar.lat, lng: lugar.lng },
        map: map,
        title: lugar.nombre,
        label: {
          text: lugar.sticker || "📍",
          fontSize: "16px"
        }
      });

      marker.addListener("click", () => {
        const contenido = `
          <div style="color: #00f0ff; font-family: 'Press Start 2P', monospace; font-size: 9px; line-height: 1.5;">
            <h3 style="color: #ff007f; margin: 0 0 8px 0; font-size: 10px;">${lugar.nombre}</h3>
            <p><strong>Tipo:</strong> ${lugar.tipo}</p>
            <p><strong>Costo:</strong> ${lugar.info}</p>
            <p style="color: #ffffff;">${lugar.descripcion}</p>
          </div>
        `;
        infoWindow.setContent(contenido);
        infoWindow.open(map, marker);
      });

      markers.push(marker);
    });
  }

  function limpiarMarcadores() {
    markers.forEach(m => m.setMap(null));
    markers = [];
  }

  function filtrarLugares(categoria) {
    if (categoria === "TODOS") {
      cargarMarcadores(lugaresPuntos);
      return;
    }

    const filtrados = lugaresPuntos.filter(l => {
      if (categoria === "GRATIS") return l.categoria === "GRATIS";
      if (categoria === "PAID") return l.categoria !== "GRATIS";
      return l.etiqueta === categoria;
    });

    cargarMarcadores(filtrados);
  }

  function vistaAmplia() {
    if (map) map.setZoom(10);
  }

  function vistaQuito() {
    if (map) {
      map.setCenter({ lat: -0.180653, lng: -78.467838 });
      map.setZoom(13);
    }
  }

  function seleccionarPersonaje(nombre, videoSrc) {
    document.getElementById("characterSelectionModal").classList.add("hidden");
    const gVideo = document.getElementById("galloVideo");
    gVideo.src = videoSrc;
    gVideo.play().catch(e => console.log(e));

    const speech = document.getElementById("galloSpeech");
    if (nombre === "marco") {
      speech.innerText = "¡HOLA! SOY MARCO. ¡VAMOS A EXPLORAR QUITO JUNTOS!";
    } else {
      speech.innerText = "¡HOLA! SOY ANDREA. ¡LISTA PARA DESCUBRIR LA CIUDAD!";
    }
  }

  function dibujarRadar() {
    const canvas = document.getElementById("radarCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let angle = 0;

    function animar() {
      ctx.fillStyle = "rgba(26, 11, 46, 0.2)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = canvas.width / 2 - 4;

      ctx.strokeStyle = "#00f0ff";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
      ctx.strokeStyle = "#ff007f";
      ctx.lineWidth = 2;
      ctx.stroke();

      angle += 0.04;
      requestAnimationFrame(animar);
    }

    animar();
  }

  /* ESCRITURA HUMANA CON TIEMPOS ALEATORIOS */
  window.addEventListener("load", () => {
    const terminal = document.getElementById("hackerTerminal");
    const texto = "Cargando nodos retro...\nInicializando mapa de Quito 8-Bit...\nConectando datos geográficos...\n¡Sistema listo!";
    let idx = 0;

    function escribirSimulacionHumana() {
      if (idx < texto.length) {
        const char = texto.charAt(idx);
        terminal.textContent += char;
        idx++;

        let delay = Math.floor(Math.random() * 70) + 20;

        if (char === "\n") {
          delay = Math.floor(Math.random() * 200) + 250;
        } else if (char === "." || char === "!") {
          delay = Math.floor(Math.random() * 150) + 120;
        }

        setTimeout(escribirSimulacionHumana, delay);
      } else {
        setTimeout(() => {
          const hackerIntro = document.getElementById("hackerIntro");
          hackerIntro.classList.add("fade-out");
          document.getElementById("characterSelectionModal").classList.remove("hidden");
        }, 800);
      }
    }

    escribirSimulacionHumana();
  });
</script>
