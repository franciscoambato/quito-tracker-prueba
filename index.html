<!DOCTYPE html>
<html>
  <head>
    <title>Quito Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-frame">
      <div id="intro-screen">
        <img class="intro-bg-image" src="quito renace.jpg" alt="Quito Renace">
        <div class="log-line visible">INICIALIZANDO QUITO TRACKER v4.2.0...</div>
      </div>

      <div class="header-bar">
        <img class="top-shield-img" src="escudo2.jpg">
        <div class="logo-badge">QUITO <canvas id="topMaskCanvas" width="16" height="16"></canvas> TRACKER</div>
        <img class="top-shield-img" src="image_a6631f.jpg">
      </div>

      <div class="map-wrapper">
        <div id="topFloatingNav" class="top-floating-nav">
          <button class="nav-btn btn-carro" onclick="trazarRuta('DRIVING')">🚗 CARRO</button>
          <button class="nav-btn btn-pie" onclick="trazarRuta('WALKING')">🚶 PIE</button>
          <button class="nav-btn btn-bici" onclick="trazarRuta('BICYCLING')">🚲 BICI</button>
          <button class="nav-btn btn-moto" onclick="trazarRuta('DRIVING')">🏍️ MOTO</button>
          <button class="nav-btn btn-limpiar" onclick="limpiarRuta()">❌ LIMPIAR</button>
        </div>

        <div id="map"></div>

        <div class="spider-badges-left">
          <div id="btnGreenBadge" class="spider-badge badge-green">🕷️</div>
          <div id="btnOrangeBadge" class="spider-badge badge-orange">🕷️</div>
        </div>

        <div class="rooster-avatar-container">
          <video class="rooster-video-left" autoplay loop muted playsinline><source src="gallo.mp4" type="video/mp4"></video>
        </div>

        <div id="speechBubbleContainer" class="speech-bubble-container">
          <div class="speech-bubble"><span id="speechBubbleText">¡HOLA!</span></div>
        </div>

        <div class="radar-wrapper-outer">
          <div id="btnFarZoom" class="radar-btn-far">🌐</div>
          <div id="btnNearZoom" class="radar-btn-near">🎯</div>
          <div class="radar-container"><canvas id="radarCanvas" width="70" height="70"></canvas></div>
        </div>
      </div>

      <div class="footer-bar">
        <div class="ticker-box">
          <div>¡EXPLORA Y DESCUBRE LOS RINCONES MÁGICOS DE QUITO!</div>
          <div class="transport-modes-row">🏍️ moto | 🚲 bici | 🚗 carro | 🚶 persona a pie</div>
        </div>
      </div>

      <div class="empty-blue-box"></div>
    </div>

    <script src="script.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7yh3TteD4adDL8pAVXIEGr6RXksDKGLo&callback=initMap&v=weekly&loading=async" async></script>
  </body>
</html>
