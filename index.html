<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Interactivo de Quito</title>
  
  <!-- Fuente Pixel Art para el estilo -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Press Start 2P', monospace, sans-serif;
      background-color: #0b1326;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* Modos de Transporte superiores */
    #barra-transporte {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #0b1326;
      border-bottom: 3px solid #000;
      justify-content: center;
    }

    .btn-modo {
      border: 3px solid #000;
      color: #fff;
      padding: 8px 14px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 4px 4px 0px #000;
    }

    .btn-carro { background-color: #3b82f6; }
    .btn-pie { background-color: #10b981; }
    .btn-bici { background-color: #06b6d4; }
    .btn-moto { background-color: #a855f7; }
    .btn-limpiar { background-color: #ef4444; }

    /* Contenedor del Mapa */
    #mapa-container {
      flex: 1;
      width: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Panel Inferior Principal */
    #panel-inferior {
      width: 100%;
      background-color: #050b18;
      border-top: 4px solid #000;
      padding: 12px 15px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Utilidad para ocultar vistas */
    .oculto {
      display: none !important;
    }

    /* VISTA 1: Leyenda / Mensaje por Defecto */
    .vista-defecto {
      text-align: center;
      width: 100%;
    }

    .vista-defecto h3 {
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .leyenda-iconos {
      display: flex;
      justify-content: center;
      gap: 15px;
      font-size: 9px;
      color: #cbd5e1;
    }

    .leyenda-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* VISTA 2: Tarjeta / Detalle del Lugar */
    .vista-tarjeta {
      position: relative;
      background-color: #ffffff;
      color: #000000;
      border: 4px solid #000;
      box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.5);
      padding: 15px;
      width: 100%;
      max-width: 500px;
      border-radius: 4px;
    }

    .btn-cerrar {
      position: absolute;
      top: 6px;
      right: 10px;
      background: transparent;
      border: none;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      color: #000;
    }

    .badge-precio {
      background-color: #ff5722;
      color: #ffffff;
      padding: 4px 8px;
      font-size: 9px;
      border: 2px solid #000;
      display: inline-block;
      margin-bottom: 10px;
    }

    .tarjeta-cuerpo {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .tarjeta-imagen-box {
      width: 110px;
      height: 80px;
      border: 3px solid #000;
      background-color: #e2e8f0;
      flex-shrink: 0;
      overflow: hidden;
    }

    .tarjeta-imagen-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tarjeta-detalles {
      flex: 1;
    }

    .tarjeta-titulo {
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 8px;
      color: #000000;
    }

    .tarjeta-descripcion {
      font-family: sans-serif;
      font-size: 11px;
      color: #475569;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- Barra de Modos de Transporte -->
  <div id="barra-transporte">
    <button class="btn-modo btn-carro">🚗 EN CARRO</button>
    <button class="btn-modo btn-pie">🚶 A PIE</button>
    <button class="btn-modo btn-bici">🚲 EN BICICLETA</button>
    <button class="btn-modo btn-moto">🛵 EN MOTOCICLETA</button>
    <button class="btn-modo btn-limpiar">❌ LIMPIAR</button>
  </div>

  <!-- Contenedor del Mapa -->
  <div id="mapa-container">
    <div id="map"></div>
  </div>

  <!-- Panel Inferior Dinámico -->
  <div id="panel-inferior">

    <!-- Vista Inicial por Defecto -->
    <div id="vista-defecto" class="vista-defecto">
      <h3>¡EXPLORA Y DESCUBRE LOS RINCONES MÁGICOS DE QUITO!</h3>
      <div class="leyenda-iconos">
        <span class="leyenda-item">🛵 moto</span>
        <span class="leyenda-item">🚲 bici</span>
        <span class="leyenda-item">🚗 carro</span>
        <span class="leyenda-item">🚶 persona a pie</span>
      </div>
    </div>

    <!-- Vista de Tarjeta de Información (Aparece al seleccionar un marcador) -->
    <div id="vista-tarjeta" class="vista-tarjeta oculto">
      <button id="btn-cerrar" class="btn-cerrar" title="Cerrar">&times;</button>
      
      <span id="lugar-etiqueta" class="badge-precio">HASTA $10 USD</span>
      
      <div class="tarjeta-cuerpo">
        <div class="tarjeta-imagen-box">
          <img id="lugar-imagen" src="" alt="Vista del lugar" />
        </div>
        <div class="tarjeta-detalles">
          <h2 id="lugar-titulo" class="tarjeta-titulo">Nombre del Lugar</h2>
          <p id="lugar-descripcion" class="tarjeta-descripcion">Cargando tarifas e información...</p>
        </div>
      </div>
    </div>

  </div>

  <!-- Script de la API de Google Maps -->
  <script src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY"></script>

  <script>
    let map;

    // Datos de ejemplo para los lugares turísticos
    const lugares = [
      {
        id: 1,
        nombre: "Basílica del Voto Nacional",
        precioMax: "HASTA $10 USD",
        tarifa: "Adulto: $2.00 (Nacional) / $3.00 (Extranjero). Niño: $1.00 (Nacional) / $1.50 (Extranjero).",
        imagen: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Bas%C3%ADlica_del_Voto_Nacional%2C_Quito%2C_Ecuador%2C_2015-07-22%2C_DD_120.JPG/320px-Bas%C3%ADlica_del_Voto_Nacional%2C_Quito%2C_Ecuador%2C_2015-07-22%2C_DD_120.JPG",
        posicion: { lat: -0.2144, lng: -78.5067 }
      }
    ];

    // Referencias a los elementos del DOM
    const vistaDefecto = document.getElementById("vista-defecto");
    const vistaTarjeta = document.getElementById("vista-tarjeta");
    const btnCerrar = document.getElementById("btn-cerrar");

    const lugarTitulo = document.getElementById("lugar-titulo");
    const lugarEtiqueta = document.getElementById("lugar-etiqueta");
    const lugarImagen = document.getElementById("lugar-imagen");
    const lugarDescripcion = document.getElementById("lugar-descripcion");

    function initMap() {
      // Inicializar el mapa centrado en Quito
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: { lat: -0.2144, lng: -78.5067 },
        disableDefaultUI: false
      });

      // Crear marcadores y asociar eventos de clic
      lugares.forEach(lugar => {
        const marker = new google.maps.Marker({
          position: lugar.posicion,
          map: map,
          title: lugar.nombre
        });

        // Evento de clic en el marcador
        marker.addListener("click", () => {
          mostrarInformacionLugar(lugar);
        });
      });
    }

    // Muestra la tarjeta con datos y oculta la leyenda por defecto
    function mostrarInformacionLugar(lugar) {
      lugarTitulo.textContent = lugar.nombre;
      lugarEtiqueta.textContent = lugar.precioMax;
      lugarImagen.src = lugar.imagen;
      lugarDescripcion.textContent = lugar.tarifa;

      vistaDefecto.classList.add("oculto");
      vistaTarjeta.classList.remove("oculto");
    }

    // Vuelve a mostrar el mensaje por defecto al pulsar la 'X'
    function cerrarTarjetaLugar() {
      vistaTarjeta.classList.add("oculto");
      vistaDefecto.classList.remove("oculto");
    }

    btnCerrar.addEventListener("click", cerrarTarjetaLugar);

    window.onload = initMap;
  </script>
</body>
</html>
