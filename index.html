<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quito, Ecuador - Retro Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0718;
      color: #00f0ff;
      overflow: hidden;
    }

    /* BARRA SUPERIOR */
    header {
      width: 100%;
      height: 40px;
      background: #1a0b2e;
      border-bottom: 2px solid #ff007f;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px #ff007f;
      z-index: 10;
      position: relative;
    }

    header h1 {
      color: #ff007f;
      font-size: 14px;
      text-shadow: 2px 2px #00f0ff;
      letter-spacing: 2px;
    }

    /* CONTENEDOR PRINCIPAL */
    #app-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 40px);
    }

    /* MAPA GOOGLE */
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* MENÚ LATERAL IZQUIERDO DE FILTROS */
    .sidebar-filters {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-filter {
      background: #0d0718;
      border: 2px solid #00f0ff;
      border-radius: 20px;
      color: #00f0ff;
      padding: 10px 18px;
      font-size: 10px;
      cursor: pointer;
      text-align: left;
      box-shadow: 3px 3px 0px #ff007f;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-filter:hover {
      background: #ff007f;
      color: #fff;
      box-shadow: 3px 3px 0px #00f0ff;
      transform: translate(-2px, -2px);
    }

    /* AVATAR Y DIÁLOGO */
    .character-widget {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      gap: 15px;
    }

    .avatar-frame {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #00f0ff;
      overflow: hidden;
      background: #2d0a4e;
      box-shadow: 0 0 12px #00f0ff;
      flex-shrink: 0;
    }

    .avatar-frame video, .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .speech-bubble {
      background: #0d0718;
      border: 2px solid #ff007f;
      border-radius: 8px;
      padding: 12px;
      max-width: 320px;
      font-size: 9px;
      line-height: 1.5;
      color: #fff;
      box-shadow: 4px 4px 0px #00f0ff;
    }

    /* RADAR Y VISTAS A LA DERECHA */
    .controls-right {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .btn-circle {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #0d0718;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px #00f0ff;
      transition: transform 0.2s;
    }

    .btn-circle:hover {
      transform: scale(1.1);
      background: #ff007f;
      color: #fff;
    }

    #radarCanvas {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid #00f0ff;
      background: #0d0718;
      box-shadow: 0 0 15px #00f0ff;
    }

    /* PANTALLA INTRO TERMINAL */
    #hackerIntro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #05030a;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.8s ease;
    }

    #hackerTerminal {
      color: #00f0ff;
      font-size: 12px;
      line-height: 1.8;
      white-space: pre-wrap;
      max-width: 600px;
      text-shadow: 0 0 5px #00f0ff;
    }

    .fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* MODAL DE PERSONAJE */
    #characterSelectionModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(13, 7, 24, 0.92);
      z-index: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }

    #characterSelectionModal.hidden {
      display: none;
    }

    .modal-title {
      color: #ff007f;
      font-size: 14px;
      text-align: center;
      text-shadow: 2px 2px #00f0ff;
    }

    .character-cards {
      display: flex;
      gap: 30px;
    }

    .card {
      background: #1a0b2e;
      border: 2px solid #00f0ff;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: 5px 5px 0px #ff007f;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #ff007f;
      box-shadow: 5px 5px 0px #00f0ff;
    }

    .card p {
      margin-top: 10px;
      font-size: 10px;
      color: #00f0ff;
    }
  </style>
</head>
<body>

  <header>
    <h1>QUITO, ECUADOR</h1>
  </header>

  <div id="app-container">
    <!-- MAPA -->
    <div id="map"></div>

    <!-- FILTROS IZQUIERDA -->
    <div class="sidebar-filters">
      <button class="btn-filter" onclick="filtrarLugares('TODOS')">🌐 TODOS</button>
      <button class="btn-filter" onclick="filtrarLugares('PLANES DESTACADOS PARA JÓVENES')">🐥 JÓVENES</button>
      <button class="btn-filter" onclick="filtrarLugares('MUSEOS')">🏛 MUSEOS</button>
      <button class="btn-filter" onclick="filtrarLugares('PARQUES')">🌳 PARQUES</button>
      <button class="btn-filter" onclick="filtrarLugares('LEYENDAS')">📜 LEYENDAS</button>
      <button class="btn-filter" onclick="filtrarLugares('GRATIS')">🎁 GRATIS</button>
      <button class="btn-filter" onclick="filtrarLugares('PAID')">💳 PAGO</button>
    </div>

    <!-- PERSONAJE -->
    <div class="character-widget">
      <div class="avatar-frame">
        <video id="galloVideo" autoplay loop muted playsinline></video>
      </div>
      <div class="speech-bubble" id="galloSpeech">
        ¡HOLA! SOY ANDREA. ¡LISTA PARA DESCUBRIR LA CIUDAD!
      </div>
    </div>

    <!-- RADAR Y NAVEGACIÓN -->
    <div class="controls-right">
      <button class="btn-circle" onclick="vistaAmplia()" title="Vista general">🌐</button>
      <button class="btn-circle" onclick="vistaQuito()" title="Centrar Quito">🎯</button>
      <canvas id="radarCanvas" width="90" height="90"></canvas>
    </div>
  </div>

  <!-- INTRO TERMINAL HACKER -->
  <div id="hackerIntro">
    <div id="hackerTerminal"></div>
  </div>

  <!-- MODAL SELECCIÓN PERSONAJE -->
  <div id="characterSelectionModal" class="hidden">
    <div class="modal-title">SELECCIONA TU GUÍA</div>
    <div class="character-cards">
      <div class="card" onclick="seleccionarPersonaje('marco', 'marco.mp4')">
        <div style="font-size: 40px;">🧢</div>
        <p>MARCO</p>
      </div>
      <div class="card" onclick="seleccionarPersonaje('andrea', 'andrea.mp4')">
        <div style="font-size: 40px;">🎧</div>
        <p>ANDREA</p>
      </div>
    </div>
  </div>

  <!-- SCRIPT GOOGLE MAPS CON API KEY -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7yh3TteD4adDL8pAVXIEGr6RXksDKGLo&callback=initMap" async defer></script>

  <!-- LÓGICA DE LA APLICACIÓN -->
  <script>
    let map;
    let infoWindow;
    let markers = [];

    let lugaresPuntos = [
      {
        "etiqueta": "PLANES DESTACADOS PARA JÓVENES",
        "nombre": "Di Pinto (Café & Taller de Arte)",
        "lat": -0.1785,
        "lng": -78.4812,
        "categoria": "HASTA $15 USD",
        "zona": "NORTE",
        "tipo": "Plan Jóvenes 1 / Arte & Café",
        "sticker": "🎨",
        "info": "Kits de pintura y cerámica desde $12.00 USD.",
        "descripcion": "Concepto de café-taller súper viral en redes enfocado en liberar el estrés. Puedes tomar café o bebidas frías mientras personalizas cerámica, macetas, lienzos, gorras o bolsas de tela.",
        "actividades": ["Pintar macetas y piezas de cerámica", "Personalizar tote bags o lienzos", "Disfrutar de café y postres gourmet"],
        "recomendacion": "Ideal para ir en pareja o con amigos. Reserva con tiempo o ve temprano los fines de semana."
      },
      {
        "etiqueta": "PLANES DESTACADOS PARA JÓVENES",
        "nombre": "Cafetería Roca Roja",
        "lat": -0.1812,
        "lng": -78.4795,
        "categoria": "HASTA $20 USD",
        "zona": "NORTE",
        "tipo": "Plan Jóvenes 2 / Cerámica & Café",
        "sticker": "🪴",
        "info": "Kits de arcilla y pintura desde $15.00 hasta $25.00 USD.",
        "descripcion": "Un espacio con estética acogedora diseñado para amantes del arte en arcilla y la cerámica. Ofrecen kits completos con pinceles y pinturas acrílicas para moldear y pintar macetas, tazas o espejos.",
        "actividades": ["Moldear arcilla desde cero", "Pintar macetas, tazas y espejos de mesa", "Armar pulseras con charms mientras tomas café"],
        "recomendacion": "Su kit de regalo con pieza de cerámica es uno de los planes más populares entre jóvenes en TikTok e Instagram."
      },
      {
        "etiqueta": "MUSEOS",
        "nombre": "Museo de la Ciudad",
        "lat": -0.2251,
        "lng": -78.5152,
        "categoria": "HASTA $10 USD",
        "zona": "CENTRO",
        "tipo": "Museo 1 / Historia",
        "sticker": "📜",
        "info": "Adultos: $4.00, Estudiantes: $2.00, Niños y Tercera edad: $2.00.",
        "descripcion": "Ubicado en el antiguo Hospital San Juan de Dios, ofrece un recorrido interactivo sobre la historia de Quito desde la era precolombina.",
        "actividades": ["Recorrer maquetas de la vida cotidiana en distintas épocas", "Visitar los patios coloniales"],
        "recomendacion": "Un espacio indispensable para entender la evolución sociocultural de Quito."
      },
      {
        "etiqueta": "PARQUES",
        "nombre": "Parque La Carolina",
        "lat": -0.1825,
        "lng": -78.4845,
        "categoria": "GRATIS",
        "zona": "NORTE",
        "tipo": "Parque 1 / Recreativo",
        "sticker": "🌳",
        "info": "Acceso libre para todo público.",
        "descripcion": "El parque urbano más activo en el corazón financiero de Quito, ideal para deporte y paseo familiar.",
        "actividades": ["Pasear en barca por la laguna", "Hacer skate o atletismo", "Visitar el Jardín Botánico (de pago)"],
        "recomendacion": "Cerca de centros comerciales y la línea del Metro de Quito."
      }
    ];

    function initMap() {
      const quitoCentro = { lat: -0.180653, lng: -78.467838 };

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: quitoCentro,
        disableDefaultUI: true,
        styles: [
          { elementType: "geometry", stylers: [{ color: "#0d0718" }] },
          { elementType: "labels.text.stroke", stylers: [{ color: "#0d0718" }] },
          { elementType: "labels.text.fill", stylers: [{ color: "#00f0ff" }] },
          {
            featureType: "administrative.locality",
            elementType: "labels.text.fill",
            stylers: [{ color: "#ff007f" }]
          },
          {
            featureType: "poi",
            elementType: "labels.text.fill",
            stylers: [{ color: "#00f0ff" }]
          },
          {
            featureType: "road",
            elementType: "geometry",
            stylers: [{ color: "#1a0b2e" }]
          },
          {
            featureType: "road",
            elementType: "geometry.stroke",
            stylers: [{ color: "#2d0a4e" }]
          },
          {
            featureType: "water",
            elementType: "geometry",
            stylers: [{ color: "#05030a" }]
          }
        ]
      });

      infoWindow = new google.maps.InfoWindow();
      cargarMarcadores(lugaresPuntos);
      dibujarRadar();
    }

    function cargarMarcadores(lugares) {
      limpiarMarcadores();

      lugares.forEach(lugar => {
        const marker = new google.maps.Marker({
          position: { lat: lugar.lat, lng: lugar.lng },
          map: map,
          title: lugar.nombre,
          label: {
            text: lugar.sticker || "📍",
            fontSize: "16px"
          }
        });

        marker.addListener("click", () => {
          const contenido = `
            <div style="color: #00f0ff; font-family: 'Press Start 2P', monospace; font-size: 9px; line-height: 1.5;">
              <h3 style="color: #ff007f; margin: 0 0 8px 0; font-size: 10px;">${lugar.nombre}</h3>
              <p><strong>Tipo:</strong> ${lugar.tipo}</p>
              <p><strong>Costo:</strong> ${lugar.info}</p>
              <p style="color: #ffffff;">${lugar.descripcion}</p>
            </div>
          `;
          infoWindow.setContent(contenido);
          infoWindow.open(map, marker);
        });

        markers.push(marker);
      });
    }

    function limpiarMarcadores() {
      markers.forEach(m => m.setMap(null));
      markers = [];
    }

    function filtrarLugares(categoria) {
      if (categoria === "TODOS") {
        cargarMarcadores(lugaresPuntos);
        return;
      }

      const filtrados = lugaresPuntos.filter(l => {
        if (categoria === "GRATIS") return l.categoria === "GRATIS";
        if (categoria === "PAID") return l.categoria !== "GRATIS";
        return l.etiqueta === categoria;
      });

      cargarMarcadores(filtrados);
    }

    function vistaAmplia() {
      if (map) map.setZoom(10);
    }

    function vistaQuito() {
      if (map) {
        map.setCenter({ lat: -0.180653, lng: -78.467838 });
        map.setZoom(13);
      }
    }

    function seleccionarPersonaje(nombre, videoSrc) {
      document.getElementById("characterSelectionModal").classList.add("hidden");
      const gVideo = document.getElementById("galloVideo");
      gVideo.src = videoSrc;
      gVideo.play().catch(e => console.log(e));

      const speech = document.getElementById("galloSpeech");
      if (nombre === "marco") {
        speech.innerText = "¡HOLA! SOY MARCO. ¡VAMOS A EXPLORAR QUITO JUNTOS!";
      } else {
        speech.innerText = "¡HOLA! SOY ANDREA. ¡LISTA PARA DESCUBRIR LA CIUDAD!";
      }
    }

    function dibujarRadar() {
      const canvas = document.getElementById("radarCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      let angle = 0;

      function animar() {
        ctx.fillStyle = "rgba(26, 11, 46, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const r = canvas.width / 2 - 4;

        ctx.strokeStyle = "#00f0ff";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
        ctx.strokeStyle = "#ff007f";
        ctx.lineWidth = 2;
        ctx.stroke();

        angle += 0.04;
        requestAnimationFrame(animar);
      }

      animar();
    }

    /* ESCRITURA HUMANA CON TIEMPOS ALEATORIOS */
    window.addEventListener("load", () => {
      const terminal = document.getElementById("hackerTerminal");
      const texto = "Cargando nodos retro...\nInicializando mapa de Quito 8-Bit...\nConectando datos geográficos...\n¡Sistema listo!";
      let idx = 0;

      function escribirSimulacionHumana() {
        if (idx < texto.length) {
          const char = texto.charAt(idx);
          terminal.textContent += char;
          idx++;

          let delay = Math.floor(Math.random() * 70) + 20;

          if (char === "\n") {
            delay = Math.floor(Math.random() * 200) + 250;
          } else if (char === "." || char === "!") {
            delay = Math.floor(Math.random() * 150) + 120;
          }

          setTimeout(escribirSimulacionHumana, delay);
        } else {
          setTimeout(() => {
            const hackerIntro = document.getElementById("hackerIntro");
            hackerIntro.classList.add("fade-out");
            document.getElementById("characterSelectionModal").classList.remove("hidden");
          }, 800);
        }
      }

      escribirSimulacionHumana();
    });
  </script>
</body>
</html>
