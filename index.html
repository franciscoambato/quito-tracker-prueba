<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quito Tracker</title>
  
  <!-- Fuente Retro / Pixel Art -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Press Start 2P', cursive, monospace;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
    }

    /* Layout Principal */
    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #map {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* Panel Lateral donde se ubica "Cómo llegar" */
    #sidebar-directions-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: 280px;
    }

    /* Clase para ocultar elementos */
    .hidden {
      display: none !important;
    }

    /* Contenedor Pixel Art de Opciones de Transporte */
    .transport-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #0044cc;
      padding: 14px;
      border: 4px solid #000;
      box-shadow: 6px 6px 0px #00000088;
    }

    .transport-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #3b82f6;
      border: 3px solid #000;
      box-shadow: 4px 4px 0px #000;
      padding: 10px 14px;
      cursor: pointer;
      color: #ffffff;
      font-size: 11px;
      user-select: none;
      transition: all 0.1s ease;
    }

    .transport-card:hover {
      background-color: #60a5fa;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000;
    }

    .transport-card:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    .transport-icon {
      width: 24px;
      height: 24px;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Panel lateral ubicado en la zona de "Cómo llegar" -->
    <div id="sidebar-directions-panel">
      <!-- El contenedor inicia oculto y solo se muestra al hacer click en una ubicación -->
      <div id="transport-options" class="transport-container hidden">
        <div class="transport-card" onclick="selectTransportMode('DRIVING')">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z'/></svg>" class="transport-icon" alt="Carro" />
          <span>EN CARRO</span>
        </div>

        <div class="transport-card" onclick="selectTransportMode('WALKING')">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z'/></svg>" class="transport-icon" alt="A Pie" />
          <span>A PIE</span>
        </div>

        <div class="transport-card" onclick="selectTransportMode('BICYCLING')">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5zm5.8-6.2l2.4-2.4.8.8c.9.9 2.2 1.5 3.5 1.5v-2c-.9 0-1.7-.4-2.3-1l-1.4-1.4c-.4-.4-1-.6-1.6-.6s-1.1.2-1.5.6L7.8 12.7c-.5.4-.8 1-.8 1.7 0 1.3 1.1 2.4 2.4 2.4h3.6l-1.2-2.3h-1.0zM19 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z'/></svg>" class="transport-icon" alt="Bicicleta" />
          <span>EN BICICLETA</span>
        </div>

        <div class="transport-card" onclick="selectTransportMode('TWO_WHEELER')">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M19.44 9.03L15.42 5H11v2h3.58l2.83 2.83c-.56.66-1.18 1.17-1.91 1.52C14.28 10.74 12.92 10 11.25 10c-2.35 0-4.25 1.9-4.25 4.25S8.9 18.5 11.25 18.5s4.25-1.9 4.25-4.25c0-.68-.16-1.32-.44-1.9.94-.52 1.73-1.28 2.38-2.32L19.44 9.03zM11.25 16.5c-1.24 0-2.25-1.01-2.25-2.25s1.01-2.25 2.25-2.25 2.25 1.01 2.25 2.25-1.01 2.25-2.25 2.25z'/></svg>" class="transport-icon" alt="Motocicleta" />
          <span>EN MOTOCICLETA</span>
        </div>
      </div>
    </div>

    <!-- Mapa de Google -->
    <div id="map"></div>
  </div>

  <script>
    // -------------------------------------------------------------
    // CONFIGURACIÓN Y SEGURIDAD DE LA API KEY
    // Reemplaza YOUR_SECURE_API_KEY por tu clave restrictiva
    // -------------------------------------------------------------
    const CONFIG = {
      GOOGLE_MAPS_API_KEY: "YOUR_SECURE_API_KEY"
    };

    let map;
    let directionsService;
    let directionsRenderer;
    let selectedLocation = null;
    let currentTravelMode = 'DRIVING';

    // Carga dinámicamente la API de Google Maps
    function loadGoogleMapsAPI() {
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${CONFIG.GOOGLE_MAPS_API_KEY}&callback=initMap`;
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    }

    function initMap() {
      // Inicializar Mapa centrado en Quito
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: -0.180653, lng: -78.467838 },
        zoom: 13,
        disableDefaultUI: false
      });

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer();
      directionsRenderer.setMap(map);

      // Listener para deseleccionar ubicación al hacer clic directamente en el mapa
      map.addListener("click", () => {
        deselectLocation();
      });

      // Marcadores de prueba
      setupSampleMarkers();
    }

    function setupSampleMarkers() {
      const locations = [
        { title: "Punto A", lat: -0.180653, lng: -78.467838 },
        { title: "Punto B", lat: -0.210000, lng: -78.490000 }
      ];

      locations.forEach(loc => {
        const marker = new google.maps.Marker({
          position: { lat: loc.lat, lng: loc.lng },
          map: map,
          title: loc.title
        });

        // Evento Click en la ubicación
        marker.addListener("click", (event) => {
          event.stop(); // Previene que el evento mapa.click se dispare
          onSelectLocation(loc);
        });
      });
    }

    // -------------------------------------------------------------
    // CONTROL DE VISIBILIDAD Y RUTAS
    // -------------------------------------------------------------

    // Se ejecuta al hacer CLICK en una ubicación
    function onSelectLocation(locationData) {
      selectedLocation = locationData;

      // Hacer aparecer las opciones de transporte en la barra
      const transportOptions = document.getElementById("transport-options");
      if (transportOptions) {
        transportOptions.classList.remove("hidden");
      }

      // Calcular la ruta con el modo de transporte seleccionado
      calculateRoute();
    }

    // Se ejecuta para OCULTAR los cuadros cuando no hay ubicación seleccionada
    function deselectLocation() {
      selectedLocation = null;

      // Ocultar opciones de transporte
      const transportOptions = document.getElementById("transport-options");
      if (transportOptions) {
        transportOptions.classList.add("hidden");
      }

      // Limpiar ruta trazada
      if (directionsRenderer) {
        directionsRenderer.setDirections({ routes: [] });
      }
    }

    // Cambiar modo de transporte mediante las tarjetas
    function selectTransportMode(mode) {
      if (!selectedLocation) return;
      currentTravelMode = mode;
      calculateRoute();
    }

    // Cálculo y renderizado de la ruta
    function calculateRoute() {
      if (!selectedLocation) return;

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          const origin = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          const destination = {
            lat: selectedLocation.lat,
            lng: selectedLocation.lng
          };

          directionsService.route(
            {
              origin: origin,
              destination: destination,
              travelMode: google.maps.TravelMode[currentTravelMode] || google.maps.TravelMode.DRIVING
            },
            (response, status) => {
              if (status === "OK") {
                directionsRenderer.setDirections(response);
              } else {
                console.error("Error al calcular la ruta:", status);
              }
            }
          );
        });
      }
    }

    // Iniciar carga del script
    window.onload = loadGoogleMapsAPI;
  </script>
</body>
</html>
