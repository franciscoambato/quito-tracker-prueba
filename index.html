<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quito Tracker - Mapa Retro Pixel Art</title>
  
  <!-- Fuente Pixel Art -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* -----------------------------------------------------------
       1. CONFIGURACIÓN BASE & ESTILOS RETRO PIXEL ART
    ----------------------------------------------------------- */
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #020617;
      font-family: 'Press Start 2P', monospace;
      color: #ffffff;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* Cabecera / Banner Superior */
    #topHeader {
      background-color: #0f172a;
      border-bottom: 4px solid #38bdf8;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-title {
      font-size: 12px;
      color: #38bdf8;
      text-shadow: 2px 2px #000000;
    }

    /* Contenedor Principal del Mapa */
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* -----------------------------------------------------------
       2. CONTROLES FLOTANTES Y FILTROS LATERALES
    ----------------------------------------------------------- */
    #filterControls {
      position: absolute;
      top: 60px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
    }

    .btn-filter {
      background-color: #1e293b;
      border: 3px solid #000;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 3px 3px 0px #000;
      transition: transform 0.1s;
    }

    .btn-filter:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }

    .btn-filter.gratis { border-color: #4ade80; }
    .btn-filter.pago { border-color: #f97316; }

    /* -----------------------------------------------------------
       3. AVATAR GALLO VIDEO (ESQUINA INFERIOR IZQUIERDA)
    ----------------------------------------------------------- */
    #galloContainer {
      position: absolute;
      bottom: 60px;
      left: 15px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      z-index: 5;
      pointer-events: none;
    }

    #galloVideo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #ef4444;
      background-color: #0f172a;
      box-shadow: 3px 3px 0px #000;
      object-fit: cover;
    }

    #galloSpeech {
      background-color: #0f172a;
      border: 3px solid #ef4444;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 9px;
      color: #ffffff;
      max-width: 260px;
      box-shadow: 3px 3px 0px #000;
      line-height: 1.4;
    }

    /* -----------------------------------------------------------
       4. RADAR CANVAS (ESQUINA INFERIOR DERECHA)
    ----------------------------------------------------------- */
    #radarContainer {
      position: absolute;
      bottom: 60px;
      right: 15px;
      width: 90px;
      height: 90px;
      background-color: rgba(15, 23, 42, 0.85);
      border: 3px solid #38bdf8;
      border-radius: 50%;
      box-shadow: 3px 3px 0px #000;
      z-index: 5;
      overflow: hidden;
    }

    #radarCanvas {
      width: 100%;
      height: 100%;
    }

    /* -----------------------------------------------------------
       5. PANEL DE BOTONES INFERIOR (RUTAS)
    ----------------------------------------------------------- */
    #extraBlueSpace {
      background-color: #0f172a;
      border-top: 4px solid #38bdf8;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #extraBlueSpace.hidden {
      display: none;
    }

    .btn-retro {
      background-color: #1e293b;
      color: #38bdf8;
      border: 2px solid #38bdf8;
      padding: 8px 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
      transition: all 0.1s ease-in-out;
    }

    .btn-retro:hover {
      background-color: #38bdf8;
      color: #0f172a;
    }

    .btn-retro.danger {
      color: #f87171;
      border-color: #f87171;
    }

    .btn-retro.danger:hover {
      background-color: #f87171;
      color: #0f172a;
    }

    /* -----------------------------------------------------------
       6. PERSONALIZACIÓN DEL INFOWINDOW
    ----------------------------------------------------------- */
    .gm-style .gm-style-iw-c {
      padding: 16px !important;
      max-width: 420px !important;
      min-width: 300px !important;
      background-color: #0f172a !important;
      border: 3px solid #38bdf8 !important;
      border-radius: 8px !important;
      box-shadow: 5px 5px 0px #000000 !important;
    }

    .gm-style .gm-style-iw-d {
      overflow: auto !important;
      max-height: 350px !important;
    }

    .gm-style button.gm-ui-hover-effect {
      filter: invert(1);
      top: 8px !important;
      right: 8px !important;
    }

    .gm-style .gm-style-iw-tc::after {
      background-color: #38bdf8 !important;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Banner Superior -->
    <div id="topHeader">
      <div class="header-title">QUITO TRACKER 8-BIT</div>
      <div style="font-size: 10px; color: #facc15;"> Pichincha, Ecuador</div>
    </div>

    <!-- El Mapa de Google -->
    <div id="map"></div>

    <!-- Filtros de Categoría -->
    <div id="filterControls">
      <button class="btn-filter gratis" onclick="filtrarLugares('GRATIS')">
        <span>🕷️</span> <span style="font-size: 9px; color: #4ade80;">GRATIS</span>
      </button>
      <button class="btn-filter pago" onclick="filtrarLugares('PAID')">
        <span>🕷️</span> <span style="font-size: 9px; color: #f97316;">PAGO</span>
      </button>
    </div>

    <!-- Personaje Gallo parlante en Video -->
    <div id="galloContainer">
      <video id="galloVideo" src="./gallo.mp4" playsinline preload="metadata"></video>
      <div id="galloSpeech">¡EXPLORA Y DESCUBRE LOS RINCONES MÁGICOS DE QUITO!</div>
    </div>

    <!-- Radar Canvas estilo SpiderWeb -->
    <div id="radarContainer">
      <canvas id="radarCanvas" width="90" height="90"></canvas>
    </div>

    <!-- Panel de Control de Rutas -->
    <div id="extraBlueSpace" class="hidden">
      <button class="btn-retro" onclick="trazarRuta('DRIVING')">🚗 CARRO</button>
      <button class="btn-retro" onclick="trazarRuta('WALKING')">🚶 PIE</button>
      <button class="btn-retro" onclick="trazarRuta('BICYCLING')">🚴 BICI</button>
      <button class="btn-retro" onclick="trazarRuta('TWO_WHEELER')">🛵 MOTO</button>
      <button class="btn-retro danger" onclick="limpiarRuta()">❌ LIMPIAR</button>
    </div>
  </div>

  <!-- Script Principal de la Aplicación -->
  <script>
    let map;
    let infoWindow;
    let directionsService;
    let directionsRenderer;
    let lugaresPuntos = [];
    let destinoSeleccionado = null;
    let markersMap = [];
    let radarAngle = 0;

    // Ubicación por defecto si falla la geolocalización (Centro Histórico de Quito)
    const defaultLocation = { lat: -0.2201, lng: -78.5123 };

    function initMap() {
      const quitoCentro = { lat: -0.1807, lng: -78.4678 };

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: quitoCentro,
        disableDefaultUI: false,
        zoomControl: true,
        styles: [
          { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
          { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
          { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
          { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
        ]
      });

      infoWindow = new google.maps.InfoWindow();
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({ 
        map: map,
        suppressMarkers: false
      });

      cargarLugares();
      iniciarRadar();
    }

    async function cargarLugares() {
      try {
        const response = await fetch("./lugares.json");
        if (!response.ok) throw new Error("No se pudo cargar lugares.json");
        lugaresPuntos = await response.json();
        renderizarMarcadores(lugaresPuntos);
      } catch (error) {
        console.error("Error al cargar los datos:", error);
        showGalloSpeech("ERROR CARGANDO DATOS DEL SERVIDOR");
      }
    }

    function renderizarMarcadores(lugares) {
      limpiarMarcadores();

      lugares.forEach((lugar) => {
        const marker = new google.maps.Marker({
          position: { lat: lugar.lat, lng: lugar.lng },
          map: map,
          title: lugar.nombre,
          label: {
            text: lugar.sticker || "📍",
            fontSize: "18px"
          }
        });

        markersMap.push(marker);

        marker.addListener("click", (e) => {
          if (e && e.stop) e.stop();
          destinoSeleccionado = lugar;
          
          const panelRutas = document.getElementById("extraBlueSpace");
          if (panelRutas) panelRutas.classList.remove("hidden");

          let listaActividadesHtml = '';
          if (lugar.actividades && Array.isArray(lugar.actividades) && lugar.actividades.length > 0) {
            listaActividadesHtml = `
              <div style="margin-top: 12px;">
                <strong style="color: #facc15; font-size: 11px; font-family: 'Press Start 2P', monospace;">ACTIVIDADES:</strong>
                <ul style="margin: 8px 0 0 16px; padding: 0; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; color: #e2e8f0; line-height: 1.4;">
                  ${lugar.actividades.map(act => `<li style="margin-bottom: 5px;">${act}</li>`).join('')}
                </ul>
              </div>
            `;
          }

          const contentString = `
            <div style="padding: 2px; color: #ffffff;">
              <h3 style="font-family: 'Press Start 2P', monospace; font-size: 13px; color: #38bdf8; margin: 0 0 10px 0; line-height: 1.4;">
                ${lugar.sticker || ''} ${lugar.nombre}
              </h3>
              
              <div style="font-size: 12px; color: #4ade80; margin-bottom: 10px; font-family: system-ui, -apple-system, sans-serif; font-weight: bold;">
                💵 ${lugar.info || lugar.categoria || ''}
              </div>

              ${lugar.descripcion ? `
                <p style="font-size: 13px; font-family: system-ui, -apple-system, sans-serif; color: #cbd5e1; margin: 10px 0; line-height: 1.5;">
                  ${lugar.descripcion}
                </p>
              ` : ''}

              ${listaActividadesHtml}

              ${lugar.recomendacion ? `
                <div style="margin-top: 12px; padding-top: 10px; border-top: 1px dashed #475569; font-size: 12px; font-family: system-ui, -apple-system, sans-serif; color: #fbbf24; line-height: 1.4;">
                  💡 <strong>Tip:</strong> ${lugar.recomendacion}
                </div>
              ` : ''}
            </div>`;

          infoWindow.setContent(contentString);
          infoWindow.open(map, marker);
          showGalloSpeech(`DESTINO: ${lugar.nombre.toUpperCase()}`);
        });
      });
    }

    function limpiarMarcadores() {
      markersMap.forEach(m => m.setMap(null));
      markersMap = [];
    }

    window.filtrarLugares = function(tipo) {
      if (tipo === 'GRATIS') {
        const gratis = lugaresPuntos.filter(l => l.categoria && l.categoria.toUpperCase().includes('GRATIS'));
        renderizarMarcadores(gratis);
        showGalloSpeech("MOSTRANDO LUGARES GRATUITOS");
      } else if (tipo === 'PAID') {
        const pago = lugaresPuntos.filter(l => l.categoria && !l.categoria.toUpperCase().includes('GRATIS'));
        renderizarMarcadores(pago);
        showGalloSpeech("MOSTRANDO LUGARES DE PAGO");
      }
    };

    function iniciarRadar() {
      const canvas = document.getElementById("radarCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      function drawRadar() {
        ctx.clearRect(0, 0, 90, 90);

        ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(45, 45, 20, 0, Math.PI * 2);
        ctx.arc(45, 45, 38, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "#38bdf8";
        ctx.beginPath();
        ctx.moveTo(45, 45);
        ctx.lineTo(45 + 40 * Math.cos(radarAngle), 45 + 40 * Math.sin(radarAngle));
        ctx.stroke();

        if (lugaresPuntos.length > 0) {
          ctx.fillStyle = "#4ade80";
          ctx.fillRect(35, 30, 3, 3);
          ctx.fillRect(55, 60, 3, 3);
          ctx.fillStyle = "#f97316";
          ctx.fillRect(40, 55, 3, 3);
        }

        radarAngle += 0.05;
        requestAnimationFrame(drawRadar);
      }
      drawRadar();
    }

    /* -----------------------------------------------------------
       7. CÁLCULO Y TRAZADO DE RUTAS AUMENTADO
    ----------------------------------------------------------- */
    window.trazarRuta = function(modo) {
      if (!destinoSeleccionado) {
        showGalloSpeech("SELECCIONA UN LUGAR EN EL MAPA");
        return;
      }

      showGalloSpeech("CALCULANDO LA RUTA...");

      const ejecutarCalculo = (origenCoords) => {
        const request = {
          origin: origenCoords,
          destination: { lat: destinoSeleccionado.lat, lng: destinoSeleccionado.lng },
          travelMode: google.maps.TravelMode[modo]
        };

        directionsService.route(request, (result, status) => {
          if (status === "OK") {
            directionsRenderer.setDirections(result);
            showGalloSpeech(`RUTA TRAZADA: ${destinoSeleccionado.nombre.toUpperCase()}`);
          } else {
            showGalloSpeech("NO SE ENCONTRÓ RUTA PARA ESE TRANSPORTE");
          }
        });
      };

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            ejecutarCalculo({
              lat: position.coords.latitude,
              lng: position.coords.longitude
            });
          },
          (error) => {
            console.warn("Geolocalización bloqueada o no disponible. Usando ubicación por defecto.", error);
            ejecutarCalculo(defaultLocation);
          },
          { timeout: 5000 }
        );
      } else {
        ejecutarCalculo(defaultLocation);
      }
    };

    window.limpiarRuta = function() {
      directionsRenderer.setDirections({ routes: [] });
      document.getElementById("extraBlueSpace").classList.add("hidden");
      infoWindow.close();
      destinoSeleccionado = null;
      showGalloSpeech("RUTA LIMPIADA");
    };

    /* -----------------------------------------------------------
       8. CONTROL DE REPRODUCCIÓN DEL VIDEO DEL GALLO
    ----------------------------------------------------------- */
    function showGalloSpeech(texto) {
      const speechBox = document.getElementById("galloSpeech");
      if (speechBox) speechBox.textContent = texto;

      const video = document.getElementById("galloVideo");
      if (video) {
        video.currentTime = 0;
        video.play().catch(e => console.log("La reproducción del video requiere interacción previa del usuario."));
      }
    }

    function loadGoogleMapsScript() {
      const apiKey = "TAIzaSyD7yh3TteD4adDL8pAVXIEGr6RXksDKGLo"; // ⚠️ Reemplaza con tu API Key de Google Maps
      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyD7yh3TteD4adDL8pAVXIEGr6RXksDKGLo&callback=initMap`;
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    }

    window.onload = loadGoogleMapsScript;
  </script>
</body>
</html>
