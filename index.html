<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quito Tracker - Pichincha Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #111827;
        font-family: 'Press Start 2P', monospace;
        overflow: hidden;
      }

      .hidden { display: none !important; }

      .app-frame img, 
      .app-frame video, 
      .app-frame canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .app-frame {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        background-color: #2b6cb0;
        border: 12px solid #1c4b72;
        padding: 6px;
        position: relative;
        box-shadow: inset 0 0 0 4px #000000;
      }

      #intro-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: #0b0f19;
        color: #38bdf8;
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 20px;
        font-size: 9px;
        line-height: 2;
        transition: opacity 0.8s ease-out;
        overflow: hidden;
      }

      .intro-bg-image {
        position: absolute;
        top: 40%; left: 50%;
        transform: translate(-50%, -50%);
        max-width: 60%;
        max-height: 50%;
        object-fit: contain;
        z-index: 102;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        border: 4px solid #38bdf8;
        animation: imageGlitch 0.2s infinite alternate;
      }

      @keyframes imageGlitch {
        0% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 1; transform: translate(-49.5%, -50.5%) scale(1.02); }
        100% { opacity: 0.9; transform: translate(-50.5%, -49.5%) scale(0.99); }
      }

      #intro-screen::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.35),
          rgba(0, 0, 0, 0.35) 2px,
          transparent 2px,
          transparent 4px
        );
        pointer-events: none;
        z-index: 103;
      }

      .log-line {
        opacity: 0;
        transform: translateY(5px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        position: relative;
        z-index: 105;
        text-shadow: 2px 2px 0px #000;
      }

      .log-line.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #1e427b;
        border: 4px solid #000000;
        padding: 6px 12px;
        margin-bottom: 6px;
        box-shadow: 4px 4px 0px #000000;
      }

      .logo-badge {
        background-color: #0f2b48;
        color: #facc15;
        border: 4px solid #000000;
        padding: 8px 16px;
        font-size: 16px;
        letter-spacing: 2px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 4px 4px 0px #000000;
        text-shadow: 2px 2px 0px #000000;
      }

      .top-shield-img {
        width: 50px;
        height: 50px;
        object-fit: contain;
        filter: drop-shadow(2px 2px 0px #000000);
      }

      .map-wrapper {
        flex: 1;
        position: relative;
        border: 4px solid #000000;
        background-color: #0d1b2a;
        box-shadow: 4px 4px 0px #000000;
      }

      #map { height: 100%; width: 100%; }

      .rooster-avatar-container {
        position: absolute;
        bottom: 10px;
        left: 10px;
        width: 75px;
        height: 75px;
        background-color: #1e3a8a;
        border: 4px solid #dc2626;
        border-radius: 50%;
        box-shadow: 3px 3px 0px #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        overflow: hidden;
      }

      .rooster-video-left {
        width: 100%; height: 100%;
        object-fit: cover;
        transform: scale(1.1);
      }

      .speech-bubble-container {
        position: absolute;
        bottom: 10px;
        left: 95px;
        z-index: 30;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        max-width: 220px;
        pointer-events: none;
      }

      .speech-bubble-container.active {
        opacity: 1;
        visibility: visible;
      }

      .speech-bubble {
        position: relative;
        background: #ffffff;
        border: 3px solid #000000;
        border-radius: 6px;
        padding: 8px 10px;
        color: #000000;
        font-size: 8px;
        line-height: 1.4;
        box-shadow: 3px 3px 0px #000000;
      }

      .radar-wrapper-outer {
        position: absolute;
        bottom: 12px;
        right: 12px;
        width: 100px;
        height: 100px;
        z-index: 20;
      }

      .radar-container {
        width: 100%;
        height: 100%;
        background: #06111e;
        border: 3px solid #38bdf8;
        border-radius: 50%;
        box-shadow: 0 0 0 3px #000000, 3px 3px 0px #000000;
        overflow: hidden;
        position: relative;
      }

      .radar-btn-far, .radar-btn-near {
        position: absolute;
        width: 32px;
        height: 32px;
        background-color: #0d253f;
        border: 2px solid #38bdf8;
        border-radius: 50%;
        box-shadow: 2px 2px 0px #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 22;
        transition: transform 0.1s ease;
      }

      .radar-btn-far { top: -2px; right: -2px; }
      .radar-btn-near { bottom: -2px; left: -2px; }

      .radar-icon-svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: #38bdf8;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .spider-badges-left {
        position: absolute;
        top: 15px; left: 0px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .spider-badge {
        width: 38px;
        height: 34px;
        border: 3px solid #000000;
        border-left: none;
        border-radius: 0 8px 8px 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        box-shadow: 3px 3px 0px #000000;
        cursor: pointer;
        user-select: none;
      }

      .badge-green { background-color: #22c55e; }
      .badge-orange { background-color: #f97316; }
      .badge-green.active { border-color: #ffffff; box-shadow: 0 0 8px #22c55e; }
      .badge-orange.active { border-color: #ffffff; box-shadow: 0 0 8px #f97316; }

      .footer-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 6px;
        width: 100%;
      }

      .ticker-box {
        width: 100%;
        background-color: #0b192e;
        color: #ffffff;
        border: 3px solid #000000;
        padding: 6px 12px;
        font-size: 9px;
        text-align: center;
        box-shadow: 3px 3px 0px #000000;
      }

      .extra-blue-space {
        min-height: 80px;
        background-color: #1c4b72;
        border: 3px solid #000000;
        margin-top: 6px;
        width: 100%;
        box-shadow: 3px 3px 0px #000000;
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 8px 12px;
        flex-wrap: wrap;
        gap: 6px;
      }

      .nav-btn {
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        padding: 8px 10px;
        color: #ffffff;
        border: 3px solid #000000;
        box-shadow: 3px 3px 0px #000000;
        cursor: pointer;
      }

      .btn-carro { background-color: #2563eb; }
      .btn-pie { background-color: #10b981; }
      .btn-bici { background-color: #06b6d4; }
      .btn-moto { background-color: #8b5cf6; }
      .btn-limpiar { background-color: #ef4444; }

      @media (max-width: 600px) {
        .logo-badge { font-size: 12px; padding: 6px 10px; }
        .top-shield-img { width: 35px; height: 35px; }
        .speech-bubble-container { max-width: 150px; left: 85px; }
      }
    </style>
  </head>
  <body>

    <div class="app-frame">
      <div id="intro-screen">
        <img class="intro-bg-image" src="quito renace.jpg" alt="Quito Renace">
        <div class="log-line">INICIALIZANDO QUITO TRACKER v4.2.0...</div>
        <div class="log-line">INICIANDO SERVICIOS PRINCIPALES [OK]</div>
        <div class="log-line">CARGANDO MOTOR DE MAPAS...</div>
        <div class="log-line">CARGANDO RECURSOS Y TICKER [OK]</div>
        <div class="log-line">CALIBRANDO SPRITES Y RADAR [OK]</div>
      </div>

      <div class="header-bar">
        <img class="top-shield-img" src="escudo2.jpg" alt="Escudo Izquierdo">
        <div class="logo-badge">
          <span>QUITO</span>
          <canvas id="topMaskCanvas" width="16" height="16" style="width: 24px; height: 24px;"></canvas>
          <span>TRACKER</span>
        </div>
        <img class="top-shield-img" src="image_a6631f.jpg" alt="Escudo Derecho">
      </div>

      <div class="map-wrapper">
        <div id="map"></div>

        <div class="spider-badges-left">
          <div id="btnGreenBadge" class="spider-badge badge-green" title="Filtrar Espacios Gratuitos">🕷️</div>
          <div id="btnOrangeBadge" class="spider-badge badge-orange" title="Filtrar Espacios de Pago">🕷️</div>
        </div>

        <div class="rooster-avatar-container">
          <video class="rooster-video-left" autoplay loop muted playsinline>
            <source src="gallo.mp4" type="video/mp4">
          </video>
        </div>

        <div id="speechBubbleContainer" class="speech-bubble-container">
          <div class="speech-bubble">
            <span id="speechBubbleText">¡HOLA!</span>
          </div>
        </div>

        <div class="radar-wrapper-outer">
          <div id="btnFarZoom" class="radar-btn-far" title="Vista Lejana">
            <svg class="radar-icon-svg" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <line x1="3.6" y1="9" x2="20.4" y2="9"></line>
              <line x1="3.6" y1="15" x2="20.4" y2="15"></line>
            </svg>
          </div>

          <div id="btnNearZoom" class="radar-btn-near" title="Quito Cercano">
            <svg class="radar-icon-svg" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8"></circle>
              <circle cx="12" cy="12" r="3" fill="#38bdf8"></circle>
            </svg>
          </div>

          <div class="radar-container">
            <canvas id="radarCanvas" width="70" height="70" style="width: 100%; height: 100%;"></canvas>
          </div>
        </div>
      </div>

      <div class="footer-bar">
        <div class="ticker-box">
          <span>¡EXPLORA Y DESCUBRE LOS RINCONES MÁGICOS DE QUITO!</span>
        </div>
      </div>

      <div id="extraBlueSpace" class="extra-blue-space hidden">
        <button class="nav-btn btn-carro" onclick="trazarRuta('DRIVING')">🚗 CARRO</button>
        <button class="nav-btn btn-pie" onclick="trazarRuta('WALKING')">🚶 PIE</button>
        <button class="nav-btn btn-bici" onclick="trazarRuta('BICYCLING')">🚲 BICI</button>
        <button class="nav-btn btn-moto" onclick="trazarRuta('TWO_WHEELER')">🏍️ MOTO</button>
        <button class="nav-btn btn-limpiar" onclick="limpiarRuta()">❌ LIMPIAR</button>
      </div>
    </div>

    <script>
      const CONFIG = {
        GOOGLE_MAPS_API_KEY: "AIzaSyD7yh3TteD4adDL8pAVXIEGr6RXksDKGLo"
      };

      let map, infoWindow, directionsService, directionsDisplay;
      let lugaresPuntos = [];
      let markersMap = [];
      let currentFilter = 'ALL';
      let currentZoomLevel = 'NEAR';
      let destinoSeleccionado = null;

      const quitoCentro = { lat: -0.1807, lng: -78.4678 };
      const LIMITES_PICHINCHA = {
        north: 0.3500, south: -0.7500,
        west: -79.3000, east: -77.7000
      };

      const mapTechStyle = [
        { "elementType": "geometry", "stylers": [{ "color": "#0a192f" }] },
        { "elementType": "labels.text.fill", "stylers": [{ "color": "#8892b0" }] },
        { "elementType": "labels.text.stroke", "stylers": [{ "color": "#0a192f" }] },
        { "featureType": "poi", "elementType": "geometry", "stylers": [{ "color": "#112240" }] },
        { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#1d2d50" }] },
        { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#0284c7" }] }
      ];

      function getStickerIcon(emoji, categoria, size = 38) {
        const esGratis = categoria && categoria.toUpperCase() === "GRATIS";
        const borderColor = esGratis ? "#22c55e" : "#f97316";

        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="${borderColor}" stroke-width="4"/>
          <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-size="20">${emoji || ''}</text>
        </svg>`;
        return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
      }

      function updateMarkersSize() {
        markersMap.forEach(item => {
          const esGratis = item.lugar.categoria && item.lugar.categoria.toUpperCase() === "GRATIS";
          let baseSize = (currentZoomLevel === 'FAR') ? 22 : 38;

          if (currentFilter === 'GRATIS') {
            baseSize = esGratis ? baseSize * 1.3 : baseSize * 0.6;
          } else if (currentFilter === 'PAGO') {
            baseSize = !esGratis ? baseSize * 1.3 : baseSize * 0.6;
          }

          const finalSize = Math.round(baseSize);
          item.marker.setIcon({
            url: getStickerIcon(item.lugar.sticker, item.lugar.categoria, finalSize),
            scaledSize: new google.maps.Size(finalSize, finalSize),
            origin: new google.maps.Point(0, 0),
            anchor: new google.maps.Point(finalSize / 2, finalSize / 2)
          });
        });
      }

      window.trazarRuta = function(modo) {
        if (!destinoSeleccionado) return;

        const destLat = destinoSeleccionado.lat;
        const destLng = destinoSeleccionado.lng;

        if (!navigator.geolocation) {
          window.open(`https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}&travelmode=${modo.toLowerCase()}`, '_blank');
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const origen = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            const request = {
              origin: origen,
              destination: { lat: destLat, lng: destLng },
              travelMode: google.maps.TravelMode[modo] || google.maps.TravelMode.DRIVING
            };

            directionsService.route(request, (result, status) => {
              if (status === 'OK') {
                directionsDisplay.setDirections(result);
                if (infoWindow) infoWindow.close();
                showGalloSpeech(`RUTAS CALCULADAS`);
              } else {
                window.open(`https://www.google.com/maps/dir/?api=1&origin=${origen.lat},${origen.lng}&destination=${destLat},${destLng}&travelmode=${modo.toLowerCase()}`, '_blank');
              }
            });
          },
          () => {
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}&travelmode=${modo.toLowerCase()}`, '_blank');
          }
        );
      };

      window.limpiarRuta = function() {
        if (directionsDisplay) directionsDisplay.set('directions', null);
        destinoSeleccionado = null;
        document.getElementById("extraBlueSpace").classList.add("hidden");
        showGalloSpeech("¡RUTA LIMPIADA!");
      };

      async function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          zoom: 12,
          center: quitoCentro,
          mapTypeId: google.maps.MapTypeId.ROADMAP,
          styles: mapTechStyle,
          disableDefaultUI: true,
          restriction: { latLngBounds: LIMITES_PICHINCHA, strictBounds: true },
        });

        directionsService = new google.maps.DirectionsService();
        directionsDisplay = new google.maps.DirectionsRenderer({
          map: map,
          suppressMarkers: false,
          polylineOptions: { strokeColor: "#38bdf8", strokeWeight: 5, strokeOpacity: 0.9 }
        });

        map.addListener("zoom_changed", () => {
          currentZoomLevel = (map.getZoom() <= 10) ? 'FAR' : 'NEAR';
          updateMarkersSize();
        });

        map.addListener("click", () => {
          destinoSeleccionado = null;
          document.getElementById("extraBlueSpace").classList.add("hidden");
        });

        infoWindow = new google.maps.InfoWindow();

        try {
          const response = await fetch('./lugares.json');
          if (!response.ok) throw new Error("JSON no encontrado");
          lugaresPuntos = await response.json();

          lugaresPuntos.forEach(lugar => {
            const marker = new google.maps.Marker({
              position: { lat: lugar.lat, lng: lugar.lng },
              map: map,
              icon: {
                url: getStickerIcon(lugar.sticker, lugar.categoria, 38),
                scaledSize: new google.maps.Size(38, 38),
                anchor: new google.maps.Point(19, 19)
              }
            });

            markersMap.push({ marker, lugar });

            marker.addListener("click", (e) => {
              if (e && e.stop) e.stop();
              destinoSeleccionado = lugar;
              document.getElementById("extraBlueSpace").classList.remove("hidden");

              const contentString = `
                <div style="font-family: 'Press Start 2P', monospace; padding: 2px; max-width: 200px; color: #000;">
                  <h3 style="font-size:9px; margin-bottom: 4px;">${lugar.sticker || ''} ${lugar.nombre}</h3>
                  <p style="font-size:8px; font-family: sans-serif; margin: 0;">${lugar.info}</p>
                </div>`;
              infoWindow.setContent(contentString);
              infoWindow.open(map, marker);
              showGalloSpeech(`DESTINO: ${lugar.nombre.toUpperCase()}`);
            });
          });
        } catch (error) {
          console.warn("Base de datos de lugares no disponible.");
          showGalloSpeech("ERROR CARGANDO DATOS");
        }
      }

      // Interfaz y animaciones
      const speechBubbleContainer = document.getElementById("speechBubbleContainer");
      const speechBubbleText = document.getElementById("speechBubbleText");
      let speechTimeout;

      function showGalloSpeech(text) {
        speechBubbleText.innerText = text;
        speechBubbleContainer.classList.add("active");
        clearTimeout(speechTimeout);
        speechTimeout = setTimeout(() => speechBubbleContainer.classList.remove("active"), 3000);
      }

      // Pantalla de carga
      const lines = document.querySelectorAll(".log-line");
      lines.forEach((line, index) => {
        setTimeout(() => line.classList.add("visible"), index * 800);
      });

      setTimeout(() => {
        const intro = document.getElementById("intro-screen");
        if (intro) {
          intro.style.opacity = "0";
          setTimeout(() => intro.style.display = "none", 800);
        }
      }, 4500);

      // Eventos UI Controles Zoom y Filtro
      document.getElementById("btnNearZoom").addEventListener("click", () => {
        if (map) { map.setCenter(quitoCentro); map.setZoom(13); }
      });
      document.getElementById("btnFarZoom").addEventListener("click", () => {
        if (map) { map.setCenter(quitoCentro); map.setZoom(10); }
      });

      const btnGreen = document.getElementById("btnGreenBadge");
      const btnOrange = document.getElementById("btnOrangeBadge");

      btnGreen.addEventListener("click", () => {
        currentFilter = (currentFilter === 'GRATIS') ? 'ALL' : 'GRATIS';
        btnGreen.classList.toggle("active", currentFilter === 'GRATIS');
        btnOrange.classList.remove("active");
        updateMarkersSize();
      });

      btnOrange.addEventListener("click", () => {
        currentFilter = (currentFilter === 'PAGO') ? 'ALL' : 'PAGO';
        btnOrange.classList.toggle("active", currentFilter === 'PAGO');
        btnGreen.classList.remove("active");
        updateMarkersSize();
      });

      // Canvas Animaciones
      const radarCanvas = document.getElementById("radarCanvas");
      const radarCtx = radarCanvas ? radarCanvas.getContext("2d") : null;
      let angle = 0;

      function drawSpiderWebRadar() {
        if (!radarCtx) return;
        radarCtx.clearRect(0, 0, 70, 70);
        const cx = 35, cy = 35;

        radarCtx.strokeStyle = "rgba(56, 189, 248, 0.35)";
        radarCtx.lineWidth = 1;
        [10, 20, 30].forEach(r => {
          radarCtx.beginPath();
          radarCtx.arc(cx, cy, r, 0, Math.PI * 2);
          radarCtx.stroke();
        });

        if (lugaresPuntos.length > 0) {
          lugaresPuntos.forEach(lugar => {
            const esGratis = lugar.categoria && lugar.categoria.toUpperCase() === "GRATIS";
            radarCtx.fillStyle = esGratis ? "#22c55e" : "#f97316";

            const rx = Math.round(cx + ((lugar.lng - quitoCentro.lng) * 180));
            const ry = Math.round(cy - ((lugar.lat - quitoCentro.lat) * 180));

            if (Math.hypot(rx - cx, ry - cy) <= 30) {
              radarCtx.fillRect(rx - 1, ry - 1, 3, 3);
            }
          });
        }

        radarCtx.strokeStyle = "#38bdf8";
        radarCtx.lineWidth = 2;
        radarCtx.beginPath();
        radarCtx.moveTo(cx, cy);
        radarCtx.lineTo(cx + Math.cos(angle) * 30, cy + Math.sin(angle) * 30);
        radarCtx.stroke();

        angle += 0.04;
        requestAnimationFrame(drawSpiderWebRadar);
      }

      drawSpiderWebRadar();

      // Carga Script de Google Maps
      window.initMap = initMap;
      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyD7yh3TteD4adDL8pAVXIEGr6RXksDKGLo&callback=initMap&v=weekly`;
      script.async = true;
      document.head.appendChild(script);
    </script>
  </body>
</html>
