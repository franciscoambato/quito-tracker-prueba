<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quito Tracker - Mapa Retro Pixel Art</title>
  
  <link rel="icon" type="image/jpeg" href="./logotipo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0d0718; /* Violeta muy oscuro Synthwave */
      font-family: 'Press Start 2P', monospace;
      color: #ffffff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      position: relative;
    }

    /* PANTALLA DE CARGA HACKER */
    #hackerIntro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #0d0718;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      color: #00f0ff; /* Turquesa neón retro */
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      overflow: hidden;
    }

    #hackerIntro.fade-out {
      opacity: 0;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }

    .logo-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10001;
      text-align: center;
      pointer-events: none;
      width: 85%;
      max-width: 320px;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      max-width: 280px;
      opacity: 0.9;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 16px #00f0ff);
      animation: glitchLogo 0.3s infinite alternate;
    }

    @keyframes glitchLogo {
      0% { transform: translate(0, 0) scale(1); filter: drop-shadow(0 0 10px #00f0ff); }
      50% { transform: translate(-3px, 3px) scale(1.03); filter: drop-shadow(0 0 18px #ff007f); }
      100% { transform: translate(3px, -2px) scale(0.98); filter: drop-shadow(0 0 12px #00f0ff); }
    }

    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 127, 0.1), rgba(0, 240, 255, 0.1), rgba(255, 234, 0, 0.05));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 10000;
    }

    #hackerTerminal {
      line-height: 1.6;
      text-shadow: 0 0 5px #00a8b3;
      white-space: pre-wrap;
      width: 100%;
      z-index: 10002;
      font-size: 9px;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 12px;
      background-color: #ff007f;
      animation: blink 0.6s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .glitch-header {
      color: #ff007f; /* Fucsia neón */
      margin-bottom: 15px;
      font-size: 11px;
      text-shadow: 2px 2px #00a8b3, -2px -2px #2d0a4e;
    }

    /* SELECCIÓN DE PERSONAJE */
    #characterSelectionModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: rgba(13, 7, 24, 0.95);
      z-index: 9998;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    #characterSelectionModal.hidden {
      display: none;
    }

    .modal-box {
      background-color: #1a0b2e;
      border: 3px solid #00f0ff;
      padding: 20px 15px;
      text-align: center;
      width: 100%;
      max-width: 420px;
      box-shadow: 4px 4px 0px #000000;
    }

    .modal-title {
      font-size: 10px;
      color: #00f0ff;
      margin-bottom: 20px;
      line-height: 1.5;
      text-shadow: 2px 2px #000000;
    }

    .characters-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .character-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .character-card:hover, .character-card:active {
      transform: scale(1.05);
    }

    .character-preview-video {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 3px solid #ff007f;
      background-color: #0d0718;
      object-fit: cover;
      object-position: center top;
      box-shadow: 3px 3px 0px #000000;
    }

    .character-btn {
      margin-top: 12px;
      background-color: #0d0718;
      color: #00f0ff;
      border: 2px solid #00f0ff;
      padding: 10px 12px;
      min-height: 44px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
    }

    .character-card:hover .character-btn, .character-card:active .character-btn {
      background-color: #00f0ff;
      color: #0d0718;
    }

    /* HEADER */
    #topHeader {
      background-color: #1a0b2e;
      border-bottom: 3px solid #ff007f;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      box-shadow: 0 4px 0 #000000;
    }

    .header-title {
      font-size: 10px;
      color: #00f0ff;
      text-shadow: 2px 2px #000000;
    }

    .header-subtitle {
      font-size: 9px;
      color: #ff007f;
    }

    #map {
      flex: 1;
      width: 100%;
      height: calc(100% - 0.3cm);
      margin-bottom: 0.3cm;
    }

    /* BOTONES OVALADOS Y DE CATEGORÍA */
    #filterControls {
      position: absolute;
      top: 55px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      padding-right: 5px;
    }

    .btn-filter {
      background-color: #1a0b2e;
      border: 2px solid #000000;
      padding: 8px 14px;
      min-height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 2px 2px 0px #000000;
      transition: transform 0.1s, background-color 0.2s;
      border-radius: 20px; /* Bordes ovalados */
    }

    .btn-filter span {
      font-size: 8px;
      font-weight: bold;
    }

    .btn-filter:hover, .btn-filter:active {
      transform: scale(1.03);
    }

    /* Estilos Neón Retro para Filtros */
    .btn-filter.gratis { border-color: #00f0ff; color: #00f0ff; }
    .btn-filter.pago { border-color: #ff007f; color: #ff007f; }
    .btn-filter.jovenes { border-color: #ffea00; color: #ffea00; }
    .btn-filter.museos { border-color: #b537f2; color: #b537f2; }
    .btn-filter.parques { border-color: #00ff66; color: #00ff66; }
    .btn-filter.leyendas { border-color: #ff7700; color: #ff7700; }
    .btn-filter.todos { border-color: #ffffff; color: #ffffff; }

    /* AVATAR DE ACOMPAÑANTE */
    #galloContainer {
      position: absolute;
      bottom: 65px;
      left: 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      z-index: 5;
      pointer-events: none;
      max-width: 65vw;
    }

    #galloVideo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #00f0ff;
      background-color: #1a0b2e;
      box-shadow: 2px 2px 0px #000000;
      object-fit: cover;
      object-position: center top;
      flex-shrink: 0;
    }

    #galloSpeech {
      background-color: #1a0b2e;
      border: 2px solid #ff007f;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 8px;
      color: #ffffff;
      box-shadow: 2px 2px 0px #000000;
      line-height: 1.3;
      word-break: break-word;
    }

    /* CONTROLES Y RADAR */
    #radarControls {
      position: absolute;
      bottom: 65px;
      right: 85px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }

    .btn-radar-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #1a0b2e;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-radar-icon:hover, .btn-radar-icon:active {
      background-color: #00f0ff;
      color: #0d0718;
      transform: scale(1.05);
    }

    #radarContainer {
      position: absolute;
      bottom: 65px;
      right: 10px;
      width: 70px;
      height: 70px;
      background-color: rgba(26, 11, 46, 0.9);
      border: 2px solid #00f0ff;
      border-radius: 50%;
      box-shadow: 2px 2px 0px #000000;
      z-index: 5;
      overflow: hidden;
    }

    #radarCanvas {
      width: 100%;
      height: 100%;
    }

    /* RUTAS */
    #extraBlueSpace {
      background-color: #1a0b2e;
      border-top: 3px solid #00f0ff;
      padding: 8px 10px;
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      align-items: center;
      z-index: 10;
      overflow-x: auto;
      white-space: nowrap;
      max-width: 100vw;
      -webkit-overflow-scrolling: touch;
    }

    #extraBlueSpace.hidden {
      display: none;
    }

    .btn-retro {
      background-color: #0d0718;
      color: #00f0ff;
      border: 2px solid #00f0ff;
      padding: 8px 12px;
      min-height: 44px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .btn-retro:hover, .btn-retro:active {
      background-color: #00f0ff;
      color: #0d0718;
    }

    .btn-retro.danger {
      color: #ffffff;
      background-color: #ff007f;
      border-color: #ffffff;
    }

    /* INFOWINDOW DE MAPS */
    .gm-style .gm-style-iw-c {
      padding: 12px !important;
      max-width: 85vw !important;
      min-width: 240px !important;
      background-color: #1a0b2e !important;
      border: 2px solid #00f0ff !important;
      border-radius: 6px !important;
      box-shadow: 3px 3px 0px #000000 !important;
    }

    .gm-style .gm-style-iw-d {
      overflow: auto !important;
      color: #ffffff !important;
      font-family: 'Press Start 2P', monospace !important;
      font-size: 9px !important;
      line-height: 1.5 !important;
    }

    .gm-style .gm-style-iw-tc::after {
      background-color: #00f0ff !important;
    }

    @media (min-width: 768px) {
      .header-title { font-size: 13px; }
      .header-subtitle { font-size: 11px; }
      #galloVideo { width: 75px; height: 75px; }
      #galloSpeech { font-size: 9px; max-width: 260px; }
      #radarContainer { width: 90px; height: 90px; }
      #radarControls { right: 110px; }
      .modal-title { font-size: 11px; }
      .character-preview-video { width: 110px; height: 110px; }
    }
  </style>
</head>

    // INICIALIZACIÓN DE LA APLICACIÓN
    window.onload = function() {
      iniciarTerminal();
    };

    function iniciarTerminal() {
      const lineas = [
        "[OK] Carga de módulos principales completada.",
        "[OK] Escaneando nodos culturales de Quito...",
        "[OK] Conectando servicio de navegación en tiempo real...",
        "[READY] Red CyberQuito en línea."
      ];
      const terminal = document.getElementById('hackerTerminal');
      let lineIndex = 0;
      let charIndex = 0;

      function escribir() {
        if (lineIndex < lineas.length) {
          if (charIndex < lineas[lineIndex].length) {
            terminal.innerHTML += lineas[lineIndex].charAt(charIndex);
            charIndex++;
            setTimeout(escribir, 15);
          } else {
            terminal.innerHTML += '\n';
            lineIndex++;
            charIndex = 0;
            setTimeout(escribir, 150);
          }
        } else {
          setTimeout(mostrarSeleccionPersonaje, 400);
        }
      }
      escribir();
    }

    function mostrarSeleccionPersonaje() {
      const hackerIntro = document.getElementById('hackerIntro');
      hackerIntro.classList.add('fade-out');
      setTimeout(() => {
        hackerIntro.style.display = 'none';
        document.getElementById('characterSelectionModal').classList.remove('hidden');
      }, 500);
    }

    function seleccionarPersonaje(nombre, videoSrc) {
      personajeActual = {
        nombre: nombre.toUpperCase(),
        video: videoSrc
      };

      document.getElementById('characterSelectionModal').classList.add('hidden');
      
      const galloVideo = document.getElementById('galloVideo');
      galloVideo.src = videoSrc;
      galloVideo.play().catch(e => console.log('Autoplay prevenido:', e));

      document.getElementById('galloSpeech').innerText = `¡HOLA, SOY ${personajeActual.nombre}! VAMOS A EXPLORAR QUITO JUNTOS.`;

      cargarMapaScript();
    }

    function cargarMapaScript() {
      if (window.google && window.google.maps) {
        initMap();
        return;
      }
      // Se instancia API de mapas si fuera necesario o se simula si falta clave API pública
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=&callback=initMap`;
      script.async = true;
      script.defer = true;
      script.onerror = () => {
        console.warn("No se pudo cargar la API de Google Maps con la clave por defecto. Modos de interfaz activados.");
        iniciarRadar();
      };
      document.head.appendChild(script);
    }

    function initMap() {
      const quitoCenter = { lat: -0.2000, lng: -78.4900 };

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: quitoCenter,
        disableDefaultUI: true,
        styles: [
          { elementType: "geometry", stylers: [{ color: "#1a0b2e" }] },
          { elementType: "labels.text.stroke", stylers: [{ color: "#1a0b2e" }] },
          { elementType: "labels.text.fill", stylers: [{ color: "#00f0ff" }] },
          { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#ff007f" }] },
          { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#00f0ff" }] },
          { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#0d2818" }] },
          { featureType: "road", elementType: "geometry", stylers: [{ color: "#2d0a4e" }] },
          { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#ff007f" }] },
          { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#ffffff" }] },
          { featureType: "water", elementType: "geometry", stylers: [{ color: "#002b36" }] },
          { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#00f0ff" }] }
        ]
      });

      infoWindow = new google.maps.InfoWindow();

      renderizarMarcadores(lugaresPuntos);
      iniciarRadar();
    }

    function renderizarMarcadores(puntos) {
      if (!map) return;
      
      limpiarMarcadores();

      puntos.forEach(lugar => {
        const marker = new google.maps.Marker({
          position: { lat: lugar.lat, lng: lugar.lng },
          map: map,
          title: lugar.nombre,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: obtenerColorPorEtiqueta(lugar.etiqueta),
            fillOpacity: 0.9,
            strokeWeight: 2,
            strokeColor: "#ffffff"
          }
        });

        marker.addListener("click", () => {
          seleccionarLugar(lugar, marker);
        });

        markersList.push(marker);
      });
    }

    function obtenerColorPorEtiqueta(etiqueta) {
      switch (etiqueta) {
        case 'PLANES DESTACADOS PARA JÓVENES': return '#ffea00';
        case 'MUSEOS': return '#b537f2';
        case 'PARQUES': return '#00ff66';
        case 'LUGARES DE HISTORIAS Y LEYENDAS': return '#ff7700';
        default: return '#00f0ff';
      }
    }

    function limpiarMarcadores() {
      markersList.forEach(m => m.setMap(null));
      markersList = [];
    }

    function seleccionarLugar(lugar, marker) {
      puntoSeleccionado = lugar;
      
      const contenidoIW = `
        <div style="font-family:'Press Start 2P', monospace; font-size:9px; color:#ffffff;">
          <div style="color:#00f0ff; font-weight:bold; margin-bottom:6px;">${lugar.sticker} ${lugar.nombre}</div>
          <div style="color:#ff007f; margin-bottom:6px;">PRECIO: ${lugar.categoria} | ZONA: ${lugar.zona}</div>
          <p style="margin:4px 0;">${lugar.descripcion}</p>
          <div style="color:#ffea00; margin-top:6px;">💡 ${lugar.recomendacion}</div>
        </div>
      `;

      infoWindow.setContent(contenidoIW);
      infoWindow.open(map, marker);

      document.getElementById('galloSpeech').innerText = `${personajeActual.nombre}: ¡${lugar.nombre}! ${lugar.info}`;
      document.getElementById('extraBlueSpace').classList.remove('hidden');
    }

    function filtrarLugares(categoria) {
      let filtrados = [];
      if (categoria === 'TODOS') {
        filtrados = lugaresPuntos;
      } else if (categoria === 'GRATIS') {
        filtrados = lugaresPuntos.filter(l => l.categoria === 'GRATIS');
      } else if (categoria === 'PAID') {
        filtrados = lugaresPuntos.filter(l => l.categoria !== 'GRATIS');
      } else {
        filtrados = lugaresPuntos.filter(l => l.etiqueta === categoria);
      }

      renderizarMarcadores(filtrados);
      document.getElementById('galloSpeech').innerText = `${personajeActual.nombre}: MOSTRANDO ${filtrados.length} LUGARES PARA '${categoria}'.`;
    }

    function vistaAmplia() {
      if (map) {
        map.setZoom(10);
        map.setCenter({ lat: -0.2000, lng: -78.4900 });
      }
    }

    function vistaQuito() {
      if (map) {
        map.setZoom(13);
        map.setCenter({ lat: -0.2200, lng: -78.5120 });
      }
    }

    function trazarRuta(modo) {
      if (!puntoSeleccionado) return;
      const url = `https://www.google.com/maps/dir/?api=1&destination=${puntoSeleccionado.lat},${puntoSeleccionado.lng}&travelmode=${modo}`;
      window.open(url, '_blank');
    }

    function limpiarRuta() {
      if (infoWindow) infoWindow.close();
      document.getElementById('extraBlueSpace').classList.add('hidden');
      puntoSeleccionado = null;
      document.getElementById('galloSpeech').innerText = `${personajeActual.nombre}: SELECCIONA UN PUNTO EN EL MAPA PARA RECORRER.`;
    }

    // EFECTO VISUAL DE RADAR RETRO
    function iniciarRadar() {
      const canvas = document.getElementById('radarCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let angle = 0;

      function draw() {
        ctx.fillStyle = 'rgba(26, 11, 46, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = canvas.width / 2 - 2;

        // Anillos del Radar
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.arc(centerX, centerY, radius * 0.6, 0, Math.PI * 2);
        ctx.arc(centerX, centerY, radius * 0.3, 0, Math.PI * 2);
        ctx.stroke();

        // Línea Escáner Giratoria
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
        ctx.strokeStyle = '#ff007f';
        ctx.lineWidth = 2;
        ctx.stroke();

        angle += 0.05;
        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>
</html>
