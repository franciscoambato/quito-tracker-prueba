<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quito Tracker - Mapa Retro</title>
  
  <!-- Fuente Pixel Art -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* -----------------------------------------------------------
       ESTILOS RETRO & PIXEL ART
    ----------------------------------------------------------- */
    * {
      box-sizing: border-box;
      image-rendering: pixelated; /* Evita que las imágenes/elementos se vean borrosos */
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #020617;
      font-family: 'Press Start 2P', monospace;
      color: #ffffff;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Contenedor del Mapa */
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* Panel inferior de botones y transporte */
    #extraBlueSpace {
      background-color: #0f172a;
      border-top: 4px solid #38bdf8;
      padding: 10px;
      display: flex;
      flex-wrap: wrap; /* Soporte responsivo para móviles */
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    #extraBlueSpace.hidden {
      display: none;
    }

    .btn-retro {
      background-color: #1e293b;
      color: #38bdf8;
      border: 2px solid #38bdf8;
      padding: 8px 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
      transition: all 0.1s ease-in-out;
    }

    .btn-retro:hover {
      background-color: #38bdf8;
      color: #0f172a;
    }

    .btn-retro.danger {
      color: #f87171;
      border-color: #f87171;
    }

    .btn-retro.danger:hover {
      background-color: #f87171;
      color: #0f172a;
    }

    /* -----------------------------------------------------------
       PERSONALIZACIÓN DEL INFOWINDOW (CUADRO ROJO MÁS GRANDE)
    ----------------------------------------------------------- */
    .gm-style .gm-style-iw-c {
      padding: 16px !important;
      max-width: 420px !important; /* Cuadro emergente más grande */
      min-width: 300px !important;
      background-color: #0f172a !important; /* Fondo oscuro retro */
      border: 3px solid #38bdf8 !important;  /* Borde brillante */
      border-radius: 8px !important;
      box-shadow: 5px 5px 0px #000000 !important;
    }

    .gm-style .gm-style-iw-d {
      overflow: auto !important;
      max-height: 350px !important; /* Scroll interno si el contenido es extenso */
    }

    /* Botón de cerrar (X) */
    .gm-style button.gm-ui-hover-effect {
      filter: invert(1);
      top: 8px !important;
      right: 8px !important;
    }

    .gm-style .gm-style-iw-tc::after {
      background-color: #38bdf8 !important; /* Flecha inferior del boceto */
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- El Mapa de Google -->
    <div id="map"></div>

    <!-- Panel de Control de Rutas -->
    <div id="extraBlueSpace" class="hidden">
      <button class="btn-retro" onclick="trazarRuta('DRIVING')">🚗 CARRO</button>
      <button class="btn-retro" onclick="trazarRuta('WALKING')">🚶 PIE</button>
      <button class="btn-retro" onclick="trazarRuta('BICYCLING')">🚴 BICI</button>
      <button class="btn-retro" onclick="trazarRuta('TWO_WHEELER')">🛵 MOTO</button>
      <button class="btn-retro danger" onclick="limpiarRuta()">❌ LIMPIAR</button>
    </div>
  </div>

  <!-- Script Principal de la Aplicación -->
  <script>
    // Variables Globales
    let map;
    let infoWindow;
    let directionsService;
    let directionsRenderer;
    let lugaresPuntos = [];
    let destinoSeleccionado = null;
    let markersMap = [];

    // 1. Inicialización del Mapa
    function initMap() {
      // Coordenadas iniciales (Centro de Quito)
      const quitoCentro = { lat: -0.1807, lng: -78.4678 };

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: quitoCentro,
        disableDefaultUI: false,
        zoomControl: true,
        styles: [
          { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
          { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
          { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
          { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
        ]
      });

      infoWindow = new google.maps.InfoWindow();
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({ map: map });

      // Cargar los datos desde el JSON local
      cargarLugares();
    }

    // 2. Cargar Datos JSON de Forma Asíncrona
    async function cargarLugares() {
      try {
        const response = await fetch("./lugares.json");
        if (!response.ok) throw new Error("No se pudo cargar lugares.json");
        lugaresPuntos = await response.json();
        
        // Renderizar marcadores
        renderizarMarcadores(lugaresPuntos);
      } catch (error) {
        console.error("Error al cargar los datos:", error);
        showGalloSpeech("ERROR CARGANDO DATOS DEL SERVIDOR");
      }
    }

    // 3. Crear los Marcadores e InfoWindows Ampliados
    function renderizarMarcadores(lugares) {
      lugares.forEach((lugar) => {
        const marker = new google.maps.Marker({
          position: { lat: lugar.lat, lng: lugar.lng },
          map: map,
          title: lugar.nombre,
          label: {
            text: lugar.sticker || "📍",
            fontSize: "18px"
          }
        });

        markersMap.push(marker);

        // Evento de Clic en el Marcador
        marker.addListener("click", (e) => {
          if (e && e.stop) e.stop();
          destinoSeleccionado = lugar;
          
          // Mostrar panel de transporte
          const panelRutas = document.getElementById("extraBlueSpace");
          if (panelRutas) panelRutas.classList.remove("hidden");

          // Construcción dinámica del HTML para Actividades
          let listaActividadesHtml = '';
          if (lugar.actividades && Array.isArray(lugar.actividades) && lugar.actividades.length > 0) {
            listaActividadesHtml = `
              <div style="margin-top: 12px;">
                <strong style="color: #facc15; font-size: 11px; font-family: 'Press Start 2P', monospace;">ACTIVIDADES:</strong>
                <ul style="margin: 8px 0 0 16px; padding: 0; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; color: #e2e8f0; line-height: 1.4;">
                  ${lugar.actividades.map(act => `<li style="margin-bottom: 5px;">${act}</li>`).join('')}
                </ul>
              </div>
            `;
          }

          // Plantilla HTML del InfoWindow (Cuadro emergente ampliado)
          const contentString = `
            <div style="padding: 2px; color: #ffffff;">
              <!-- Título con sticker -->
              <h3 style="font-family: 'Press Start 2P', monospace; font-size: 13px; color: #38bdf8; margin: 0 0 10px 0; line-height: 1.4;">
                ${lugar.sticker || ''} ${lugar.nombre}
              </h3>
              
              <!-- Precio / Categoría -->
              <div style="font-size: 12px; color: #4ade80; margin-bottom: 10px; font-family: system-ui, -apple-system, sans-serif; font-weight: bold;">
                💵 ${lugar.info || lugar.categoria || ''}
              </div>

              <!-- Descripción -->
              ${lugar.descripcion ? `
                <p style="font-size: 13px; font-family: system-ui, -apple-system, sans-serif; color: #cbd5e1; margin: 10px 0; line-height: 1.5;">
                  ${lugar.descripcion}
                </p>
              ` : ''}

              <!-- Lista de Actividades -->
              ${listaActividadesHtml}

              <!-- Recomendación -->
              ${lugar.recomendacion ? `
                <div style="margin-top: 12px; padding-top: 10px; border-top: 1px dashed #475569; font-size: 12px; font-family: system-ui, -apple-system, sans-serif; color: #fbbf24; line-height: 1.4;">
                  💡 <strong>Tip:</strong> ${lugar.recomendacion}
                </div>
              ` : ''}
            </div>`;

          infoWindow.setContent(contentString);
          infoWindow.open(map, marker);
          showGalloSpeech(`DESTINO: ${lugar.nombre.toUpperCase()}`);
        });
      });
    }

    // 4. Funciones de Trazado de Ruta
    window.trazarRuta = function(modo) {
      if (!destinoSeleccionado) return;

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const origen = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };

            const request = {
              origin: origen,
              destination: { lat: destinoSeleccionado.lat, lng: destinoSeleccionado.lng },
              travelMode: google.maps.TravelMode[modo]
            };

            directionsService.route(request, (result, status) => {
              if (status === "OK") {
                directionsRenderer.setDirections(result);
              } else {
                alert("No se pudo calcular la ruta: " + status);
              }
            });
          },
          () => {
            alert("Error al obtener la ubicación actual.");
          }
        );
      }
    };

    window.limpiarRuta = function() {
      directionsRenderer.setDirections({ routes: [] });
      document.getElementById("extraBlueSpace").classList.add("hidden");
      infoWindow.close();
    };

    function showGalloSpeech(texto) {
      console.log("MENSAJE GALLO:", texto);
    }

    // 5. Cargar Google Maps Script dinámicamente de forma limpia
    function loadGoogleMapsScript() {
      const apiKey = "TU_API_KEY_AQUI"; // ⚠️ Reemplaza con tu API Key de Google Maps
      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=AIzaSyD7yh3TteD4adDL8pAVXIEGr6RXksDKGLo&callback=initMap`;
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    }

    window.onload = loadGoogleMapsScript;
  </script>
</body>
</html>
