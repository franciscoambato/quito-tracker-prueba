<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quito Tracker - Retro Frame</title>
  
  <link rel="icon" type="image/jpeg" href="./logotipo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0d0718;
      font-family: 'Press Start 2P', monospace;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* CONTENEDOR TIPO MARCO RETRO */
    #device-frame {
      position: relative;
      width: 96vw;
      height: 94vh;
      max-width: 1200px;
      max-height: 700px;
      background-color: #1a71b8;
      border: 8px solid #0f4471;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 10px #000000;
      display: flex;
      flex-direction: column;
    }

    /* BARRA SUPERIOR */
    #frame-top-bar {
      height: 45px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      position: relative;
    }

    #btnBanderaQuito {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid #ffea00;
      background-color: #1a0b2e;
      background-image: url('./bandera_quito.jpg');
      background-size: cover;
      background-position: center;
      cursor: pointer;
      box-shadow: 0 0 8px #ffea00;
      transition: transform 0.2s;
      z-index: 20;
    }

    #btnBanderaQuito:hover {
      transform: scale(1.1);
    }

    #title-banner {
      background-color: #0f4471;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      padding: 6px 16px;
      color: #00f0ff;
      font-size: 11px;
      text-shadow: 2px 2px #000000;
      letter-spacing: 1px;
      box-shadow: inset 0 0 6px #000000;
    }

    /* ÁREA PANTALLA PRINCIPAL CON MAPA */
    #screen-area {
      flex: 1;
      position: relative;
      background-color: #05020a;
      border: 4px solid #0a2c4a;
      border-radius: 8px;
      overflow: hidden;
      margin: 6px 0;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .screen-crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                  radial-gradient(circle, transparent 60%, rgba(0,0,0,0.5) 100%);
      background-size: 100% 4px, 100% 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* VISTA DE INFORMACIÓN A PANTALLA COMPLETA SOBRE EL MAPA */
    #infoFullScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #800020 100%);
      padding: 30px 20px;
      box-sizing: border-box;
      z-index: 40;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    #infoFullScreen.hidden {
      display: none;
    }

    #infoFullScreen .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: #800020;
      color: #ffffff;
      border: 2px solid #ffcc00;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    #fullScreenCard {
      width: 100%;
      max-width: 700px;
      background: rgba(10, 20, 35, 0.85);
      border: 3px solid #00f0ff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    /* MENÚ DESPLEGABLE DE CATEGORÍAS */
    #filterMenuModal {
      position: absolute;
      top: 50px;
      left: 10px;
      background-color: #1a0b2e;
      border: 3px solid #ffea00;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
      box-shadow: 4px 4px 0px #000000;
      max-height: 80%;
      overflow-y: auto;
    }

    #filterMenuModal.hidden {
      display: none;
    }

    .btn-filter {
      background-color: #0d0718;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      padding: 8px 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      cursor: pointer;
      text-align: left;
      border-radius: 12px;
      transition: background-color 0.2s;
    }

    .btn-filter:hover {
      background-color: #00f0ff;
      color: #0d0718;
    }

    /* BARRA INFERIOR */
    #frame-bottom-bar {
      height: 55px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      position: relative;
    }

    #companion-container {
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }

    #galloVideo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #ff007f;
      background-color: #0d0718;
      object-fit: cover;
      object-position: center top;
      box-shadow: 0 0 8px #ff007f;
    }

    #galloSpeech {
      background-color: #0f4471;
      border: 2px solid #00f0ff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 7px;
      color: #ffffff;
      max-width: 40vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* BOTÓN TU UBICACIÓN */
    #btn-tu-ubicacion {
      background-color: #ff0055;
      border: 2px solid #ffea00;
      border-radius: 12px;
      padding: 8px 14px;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
      transition: transform 0.2s, background-color 0.2s;
    }

    #btn-tu-ubicacion:hover {
      transform: scale(1.05);
      background-color: #e6004c;
    }

    /* MODAL SELECCIÓN PERSONAJE */
    #characterSelectionModal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(13, 7, 24, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
    }

    #characterSelectionModal.hidden {
      display: none;
    }

    .modal-box {
      background-color: #1a0b2e;
      border: 3px solid #00f0ff;
      padding: 20px;
      text-align: center;
      border-radius: 12px;
    }

    .characters-grid {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }

    .character-card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .character-preview-video {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid #ff007f;
      object-fit: cover;
    }

    .character-btn {
      margin-top: 8px;
      background-color: #0d0718;
      color: #00f0ff;
      border: 1px solid #00f0ff;
      padding: 6px 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="device-frame">
    <div id="frame-top-bar">
      <div id="btnBanderaQuito" onclick="toggleFiltros()" title="Seleccionar Tipo de Lugar"></div>
      <div id="title-banner">QUITO TRACKER</div>
      <div></div>
    </div>

    <div id="screen-area">
      <div class="screen-crt-overlay"></div>
      <div id="map"></div>

      <!-- VISTA PANTALLA COMPLETA PARA DETALLES DE LUGAR -->
      <div id="infoFullScreen" class="hidden">
        <button class="close-btn" onclick="cerrarFullScreen()">✕</button>
        <div id="fullScreenCard"></div>
      </div>

      <div id="filterMenuModal" class="hidden">
        <button class="btn-filter" onclick="filtrarLugares('TODOS')">🌐 TODOS</button>
        <button class="btn-filter" onclick="filtrarLugares('PLANES DESTACADOS PARA JÓVENES')">🎨 JÓVENES</button>
        <button class="btn-filter" onclick="filtrarLugares('MUSEOS')">🏺 MUSEOS</button>
        <button class="btn-filter" onclick="filtrarLugares('PARQUES')">🌳 PARQUES</button>
        <button class="btn-filter" onclick="filtrarLugares('LUGARES DE HISTORIAS Y LEYENDAS')">📜 LEYENDAS</button>
        <button class="btn-filter" onclick="filtrarLugares('SUR DE QUITO')">🍎 SUR QUITO</button>
        <button class="btn-filter" onclick="filtrarLugares('AMAGUAÑA Y PERIFERIA SUR')">🎭 AMAGUAÑA</button>
        <button class="btn-filter" onclick="filtrarLugares('MACHACHI Y CANTON MEJÍA')">🧀 MACHACHI</button>
        <button class="btn-filter" onclick="filtrarLugares('RUTA DE LOS VOLCANES Y ALREDEDORES')">🌋 VOLCANES</button>
        <button class="btn-filter" onclick="filtrarLugares('GRATIS')">🎁 GRATIS</button>
        <button class="btn-filter" onclick="filtrarLugares('PAID')">🪙 PAGO</button>
      </div>

      <div id="characterSelectionModal">
        <div class="modal-box">
          <div style="font-size: 9px; color: #00f0ff;">SELECCIONA TU GUÍA</div>
          <div class="characters-grid">
            <div class="character-card" onclick="seleccionarPersonaje('MARCO', './gallo.mp4')">
              <video class="character-preview-video" src="./gallo.mp4" playsinline muted autoplay loop></video>
              <button class="character-btn">MARCO</button>
            </div>
            <div class="character-card" onclick="seleccionarPersonaje('ANDREA', './gallo_mujer.mp4')">
              <video class="character-preview-video" src="./gallo_mujer.mp4" playsinline muted autoplay loop></video>
              <button class="character-btn">ANDREA</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="frame-bottom-bar">
      <div id="companion-container">
        <video id="galloVideo" src="./gallo.mp4" playsinline muted loop autoplay></video>
        <div id="galloSpeech">¡BIENVENIDO A QUITO!</div>
      </div>
      <button id="btn-tu-ubicacion" onclick="enfocarTuUbicacion()">📍 TU UBICACIÓN</button>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
