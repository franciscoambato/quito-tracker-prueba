<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quito Tracker</title>
  <!-- Font Retro Arcade (Press Start 2P) -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- FontAwesome / Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b132b;
      color: #ffffff;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* HEADER FIX */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: #1c2541;
      border-bottom: 4px solid #4895ef;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
    }

    .title-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .header-title {
      color: #ffbd59;
      font-size: 16px;
      text-shadow: 2px 2px #000;
      letter-spacing: 2px;
    }

    /* REEMPLAZO SPIDERMAN: CATEDRAL / ROBOT ANIMADO */
    .header-icon-anim {
      font-size: 24px;
      color: #4cc9f0;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* SECCIÓN PRINCIPAL: MAPA COMPLETO (100VH) */
    #map-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding-top: 60px; /* offset por header */
    }

    #map {
      width: 100%;
      height: 100%;
      background: #1c2541; /* Placeholder del Mapa Leaflet/Mapbox */
      display: flex;
      justify-content: center;
      align-items: center;
      color: #4cc9f0;
      font-size: 12px;
    }

    /* INDICADOR SCROLL PARA REVELAR PANEL */
    .scroll-hint {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #4cc9f0;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 9px;
      color: #fff;
      animation: pulse 1.5s infinite;
      z-index: 500;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* PANEL INFERIOR (SCROLL / HALF SCREEN) */
    #control-panel {
      min-height: 60vh;
      background: #0b132b;
      border-top: 4px solid #ff1053;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: all 0.5s ease-in-out;
    }

    /* TÍTULO INTERESANTE / CÓMO LLEGAR */
    .panel-title {
      font-size: 13px;
      color: #ffbd59;
      text-align: center;
      text-shadow: 2px 2px 0px #000;
      background: #1c2541;
      padding: 10px 20px;
      border: 2px solid #4895ef;
      box-shadow: 4px 4px 0px #000;
      border-radius: 4px;
    }

    /* BOTONES DE TRANSPORTE (SIN BOTÓN LIMPIAR) */
    .transport-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      max-width: 800px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    /* CLASE OCULTA TEMPORIZADA (5 SEGUNDOS) */
    .transport-container.hidden-auto {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    .btn-transport {
      background: #3a86ff;
      color: #fff;
      border: 3px solid #000;
      padding: 12px 16px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 3px 3px 0px #000;
      transition: all 0.1s ease;
    }

    .btn-transport:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }

    .btn-transport.car { background-color: #4895ef; }
    .btn-transport.walk { background-color: #06d6a0; }
    .btn-transport.bike { background-color: #4cc9f0; }
    .btn-transport.moto { background-color: #7209b7; }

  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="title-container">
      <i class="fa-solid fa-shield-halved" style="color:#ffbd59;"></i>
      <h1 class="header-title">QUITO TRACKER</h1>
      <!-- CATEDRAL / ROBOT ANIMADO REEMPLAZANDO A SPIDERMAN -->
      <i class="fa-solid fa-church header-icon-anim" title="Catedral de Quito"></i> 
      <!-- O si prefieres robot, cambia a: <i class="fa-solid fa-robot header-icon-anim"></i> -->
    </div>
  </header>

  <!-- MAPA VISTA COMPLETA 100VH -->
  <div id="map-wrapper">
    <div id="map">
      <!-- AQUÍ VA TU MAPA LEAFLET / MAPBOX -->
      <p>[ CORTINILLA Y MAPA DE QUITO TRACKER ]</p>
    </div>
    <div class="scroll-hint">↓ DESLIZA PARA MÁS OPCIONES ↓</div>
  </div>

  <!-- PANEL INFERIOR SEGUNDA MITAD (CÓMO LLEGAR) -->
  <section id="control-panel">
    
    <!-- TÍTULO INTERESANTE -->
    <div class="panel-title">
      🗺️ RUTA Y TRANSPORTE EXPLORADOR
    </div>

    <!-- BOTONES DE MEDIO DE TRANSPORTE (SIN BOTÓN LIMPIAR) -->
    <div class="transport-container" id="transportBox">
      <button class="btn-transport car" onclick="onTransportSelect('carro')">
        <i class="fa-solid fa-car"></i> EN CARRO
      </button>
      <button class="btn-transport walk" onclick="onTransportSelect('pie')">
        <i class="fa-solid fa-person-walking"></i> A PIE
      </button>
      <button class="btn-transport bike" onclick="onTransportSelect('bicicleta')">
        <i class="fa-solid fa-bicycle"></i> EN BICICLETA
      </button>
      <button class="btn-transport moto" onclick="onTransportSelect('moto')">
        <i class="fa-solid fa-motorcycle"></i> EN MOTOCICLETA
      </button>
    </div>

  </section>

  <script>
    let autoHideTimer = null;
    const transportBox = document.getElementById('transportBox');

    // Lógica para cerrar/ocultar el cuadro si no se pulsa ningún botón en 5 segundos
    function startAutoHideTimer() {
      clearTimeout(autoHideTimer);
      autoHideTimer = setTimeout(() => {
        transportBox.classList.add('hidden-auto');
        console.log("Panel de transporte ocultado automáticamente tras 5 segundos.");
      }, 5000);
    }

    // Iniciar temporizador cuando el panel entra en pantalla o al cargar
    window.addEventListener('scroll', () => {
      const panel = document.getElementById('control-panel');
      const rect = panel.getBoundingClientRect();
      
      // Si el panel de control es visible en la pantalla
      if (rect.top < window.innerHeight && !transportBox.classList.contains('hidden-auto')) {
        if (!autoHideTimer) {
          startAutoHideTimer();
        }
      }
    });

    // Acción al pulsar un botón
    function onTransportSelect(mode) {
      // Cancelar autocierre si el usuario presionó una opción
      clearTimeout(autoHideTimer);
      autoHideTimer = null;
      
      alert(`Modo seleccionado: ${mode.toUpperCase()}`);
      // Aquí agregas tu lógica de cálculo de ruta existente...
    }

    // Arrancar temporizador inicial
    startAutoHideTimer();
  </script>
</body>
</html>
