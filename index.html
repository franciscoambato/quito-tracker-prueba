<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quito Tracker - Hacker Corp</title>
    
    <style>
        /* --------------------------------------------------
         * Estilos Globales & Tema Retro / Cyberpunk
         * -------------------------------------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0221;
            color: #ff007f;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Header Principal */
        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            text-align: center;
        }

        /* 1. TÍTULO MÁS GRANDE Y CENTRADO */
        .main-title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #00f6ff;
            text-shadow: 0 0 10px #00f6ff, 0 0 20px #ff007f;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
        }

        /* 2. LOGO HACKER CORP MÁS GRANDE */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 0, 127, 0.1);
            border: 2px solid #ff007f;
            padding: 12px 28px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            margin-top: 10px;
        }

        .brand-logo svg {
            width: 42px;
            height: 42px;
            fill: #ffe600;
            filter: drop-shadow(0 0 5px #ffe600);
        }

        .brand-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffe600;
            letter-spacing: 3px;
            text-shadow: 0 0 8px #ffe600;
        }

        /* Panel Principal del Tracker */
        .tracker-card {
            width: 100%;
            max-width: 900px;
            background: #190a38;
            border: 2px solid #00f6ff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0, 246, 255, 0.2);
        }

        .status-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0d0221;
            padding: 15px 20px;
            border-radius: 6px;
            border-left: 4px solid #ff007f;
            margin-bottom: 20px;
        }

        .status-label {
            color: #00f6ff;
            font-size: 1.1rem;
        }

        .status-value {
            color: #ffe600;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-retro {
            background-color: transparent;
            color: #00f6ff;
            border: 2px solid #00f6ff;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
        }

        .btn-retro:hover {
            background-color: #00f6ff;
            color: #0d0221;
            box-shadow: 0 0 15px #00f6ff;
        }
    </style>
</head>
<body>

    <header>
        <!-- Título Quito Tracker agrandado y centrado -->
        <h1 class="main-title">Quito Tracker</h1>

        <!-- Logo Hacker Corp agrandado -->
        <div class="brand-logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span class="brand-text">HACKER CORP</span>
        </div>
    </header>

    <main class="tracker-card">
        <div class="status-display">
            <span class="status-label">Estado del Sistema:</span>
            <span id="system-status" class="status-value">ONLINE / MONITORIZANDO</span>
        </div>

        <div class="status-display">
            <span class="status-label">Coordenadas Actuales:</span>
            <span id="coords-display" class="status-value">-0.1807, -78.4678 (Quito, EC)</span>
        </div>

        <div class="controls">
            <button class="btn-retro" id="btn-scan">Escanear Sector</button>
            <button class="btn-retro" id="btn-reset">Reiniciar Nodo</button>
        </div>
    </main>

    <!-- 3. CÓDIGO ESC RITO CON ESTILO HUMANO Y ESTRUCTURADO -->
    <script>
        // =========================================================
        // Módulo de Monitoreo - Quito Tracker
        // Desarrollado por: Hacker Corp Team
        // =========================================================

        // Configuración general y selectores de la interfaz
        const config = {
            centerCoords: { lat: -0.180653, lng: -78.467838 },
            scanInterval: 3000
        };

        const elements = {
            statusText: document.getElementById('system-status'),
            coordsText: document.getElementById('coords-display'),
            scanBtn: document.getElementById('btn-scan'),
            resetBtn: document.getElementById('btn-reset')
        };

        // Genera pequeñas variaciones aleatorias simulando movimiento en Quito
        function generateRandomOffset() {
            const deltaLat = (Math.random() - 0.5) * 0.008;
            const deltaLng = (Math.random() - 0.5) * 0.008;
            return { deltaLat, deltaLng };
        }

        // Ejecuta la simulación de escaneo del radar
        function performSectorScan() {
            elements.statusText.textContent = 'ESCANEAR SECTOR...';
            elements.statusText.style.color = '#ffe600';

            setTimeout(() => {
                const { deltaLat, deltaLng } = generateRandomOffset();
                const newLat = (config.centerCoords.lat + deltaLat).toFixed(4);
                const newLng = (config.centerCoords.lng + deltaLng).toFixed(4);

                elements.coordsText.textContent = `${newLat}, ${newLng} (Quito Centro)`;
                elements.statusText.textContent = 'ESCANEO COMPLETADO';
                elements.statusText.style.color = '#00f6ff';
            }, 1200);
        }

        // Restablece los valores por defecto del sistema
        function resetTrackerSystem() {
            elements.statusText.textContent = 'ONLINE / MONITORIZANDO';
            elements.statusText.style.color = '#ffe600';
            elements.coordsText.textContent = '-0.1807, -78.4678 (Quito, EC)';
        }

        // Inicialización de eventos
        function initApp() {
            elements.scanBtn.addEventListener('click', performSectorScan);
            elements.resetBtn.addEventListener('click', resetTrackerSystem);

            console.log("Quito Tracker inicializado con éxito.");
        }

        // Arrancar la aplicación al cargar la página
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
