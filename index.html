<!DOCTYPE1 html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  
  <!-- 1. ETIPETA VIEWPORT PARA MÓVILES -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Quito Tracker - Mapa Retro Pixel</title>

  <!-- ICONO EN LA PESTAÑA (FAVICON EN EL ÁREA AZUL) -->
  <!-- Reemplaza "ruta/de/tu-logotipo.png" por la ubicación real de tu imagen -->
  <link rel="icon" type="image/png" href="ruta/de/tu-logotipo.png">

  <!-- Estilos CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ENCABEZADO Y NAVEGACIÓN -->
  <header class="header">
    <div class="logo-container">
      <img src="ruta/de/tu-logotipo.png" alt="Quito Tracker Logo" class="logo-img">
      <span class="logo-text">Quito Tracker</span>
    </div>

    <!-- 4. MENÚ DE HAMBURGUESA PARA MÓVIL -->
    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
      ☰
    </button>

    <nav class="nav-menu" id="nav-menu">
      <a href="#inicio" class="nav-link">Inicio</a>
      <a href="#mapa" class="nav-link">Mapa</a>
      <a href="#contacto" class="nav-link">Contacto</a>
    </nav>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">
    <section class="card">
      <h1>Bienvenido a Quito Tracker</h1>
      <p>Explora el mapa retro pixelado directamente desde tu teléfono o computadora.</p>
    </section>

    <!-- 4. FORMULARIO CON TECLADOS Y BOTONES OPTIMIZADOS -->
    <section class="card">
      <h2>Iniciar Sesión</h2>
      <form class="mobile-form">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com" required>

        <label for="phone">Teléfono:</label>
        <input type="tel" id="phone" placeholder="0991234567">

        <button type="submit" class="btn-primary">Ingresar</button>
      </form>
    </section>
  </main>

  <!-- LÓGICA DEL MENÚ INTERACTIVO EN MÓVIL -->
  <script>
    const menuToggle = document.getElementById('menu-toggle');
    const navMenu = document.getElementById('nav-menu');

    menuToggle.addEventListener('click', () => {
      navMenu.classList.toggle('active');
    });
  </script>
</body>
</html>
